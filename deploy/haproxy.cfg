global
    log stdout format raw local0
    maxconn 4096

defaults
    log global
    mode http
    option httplog
    option dontlognull
    timeout connect 5s
    timeout client  2m
    timeout server  2m
    timeout tunnel  1h

resolvers docker
    nameserver dns 127.0.0.11:53
    accepted_payload_size 8192
    hold valid 10s

frontend tbot_ws
    bind *:8000
    http-request set-header x-tbot-affinity-key %[hdr(x-device-id),lower] if { hdr(x-device-id) -m found }
    http-request set-header x-tbot-affinity-key %[hdr(device-id),lower] if { hdr(device-id) -m found }
    http-request set-header x-tbot-affinity-key %[url_param(device-id),url_dec,lower] if { url_param(device-id) -m found }
    acl is_tbot_http_path path_beg /tbot/ota/ /internal/ /mcp/vision/ /tbot/lesson-assets/
    use_backend tbot_http_backend if is_tbot_http_path
    default_backend tbot_ws_backend

backend tbot_ws_backend
    balance hdr(x-tbot-affinity-key)
    hash-type consistent
    option httpchk GET /tbot/ota/
    server-template tbot 10 tbot-esp32-server:8000 check port 8003 resolvers docker resolve-prefer ipv4 init-addr libc,none

frontend tbot_http
    bind *:8003
    http-request set-header x-tbot-affinity-key %[hdr(x-device-id),lower] if { hdr(x-device-id) -m found }
    http-request set-header x-tbot-affinity-key %[hdr(device-id),lower] if { hdr(device-id) -m found }
    http-request set-header x-tbot-affinity-key %[url_param(device-id),url_dec,lower] if { url_param(device-id) -m found }
    default_backend tbot_http_backend

backend tbot_http_backend
    balance hdr(x-tbot-affinity-key)
    hash-type consistent
    option httpchk GET /tbot/ota/
    server-template tbot 10 tbot-esp32-server:8003 check resolvers docker resolve-prefer ipv4 init-addr libc,none
