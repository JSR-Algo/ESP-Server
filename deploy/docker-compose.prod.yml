services:
  tbot-wss-lb:
    image: ${HAPROXY_IMAGE:-haproxy:3.0-alpine}
    container_name: tbot-wss-lb
    restart: unless-stopped
    depends_on:
      - tbot-esp32-server
    # F-T64-05: bind to loopback. Without the 127.0.0.1 prefix Docker publishes on
    # 0.0.0.0, so on a VPS without a host firewall the whole ESP surface — including
    # /internal/* — is reachable directly, bypassing the tunnel and Nginx.
    # Nothing legitimate needs the wildcard bind: cloudflared runs as a host systemd
    # service and reaches these over 127.0.0.1 (see deploy/cloudflared/config.yml.example,
    # `service: http://127.0.0.1:8003` / `:8000`), and Nginx proxies to 127.0.0.1 too.
    ports:
      - "127.0.0.1:${TBOT_WS_PORT:-8000}:8000"
      - "127.0.0.1:${TBOT_HTTP_PORT:-8003}:8003"
    volumes:
      - ./haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    networks:
      - tbot

  tbot-esp32-server:
    image: ${TBOT_SERVER_IMAGE:?set TBOT_SERVER_IMAGE}
    restart: unless-stopped
    deploy:
      replicas: ${TBOT_SERVER_REPLICAS:-2}
    depends_on:
      tbot-esp32-server-db:
        condition: service_healthy
      tbot-esp32-server-redis:
        condition: service_healthy
    security_opt:
      - seccomp:unconfined
    environment:
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
      NODE_ENV: ${NODE_ENV:-production}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      TBOT_GOOGLE_LIVE_ENABLED: ${TBOT_GOOGLE_LIVE_ENABLED:-true}
      TBOT_GOOGLE_LIVE_MODEL: ${TBOT_GOOGLE_LIVE_MODEL:-gemini-3.1-flash-live-preview}
      TBOT_GOOGLE_LIVE_VOICE_NAME: ${TBOT_GOOGLE_LIVE_VOICE_NAME:-Kore}
      TBOT_PUBLIC_WEBSOCKET_URL: ${TBOT_PUBLIC_WEBSOCKET_URL:?set TBOT_PUBLIC_WEBSOCKET_URL}
      TBOT_BACKEND_API_URL: ${TBOT_BACKEND_API_URL:?set TBOT_BACKEND_API_URL}
      TBOT_SERVER_AUTH_KEY: ${TBOT_SERVER_AUTH_KEY:?set TBOT_SERVER_AUTH_KEY}
      TBOT_FACTORY_TEST_CLAIMED_DEVICES: ${TBOT_FACTORY_TEST_CLAIMED_DEVICES:-}
      REDIS_URL: redis://:${REDIS_PASSWORD:-}@tbot-esp32-server-redis:6379/0
      TBOT_LIVE_REDIS_NAMESPACE: ${TBOT_LIVE_REDIS_NAMESPACE:-prod}
      # Lesson runtime toggles (additive; default empty = off). LESSON_SAMPLE_ENABLED
      # turns on the built-in demo lesson that plays on the start_lesson voice trigger
      # with no backend assignment; LESSON_RUNTIME_ENABLED / COURSE_BACKEND_URL drive
      # the real assigned-lesson path. Previously unforwarded, so these env vars never
      # reached the app — set them in /opt/tbot/.env to take effect.
      LESSON_RUNTIME_ENABLED: ${LESSON_RUNTIME_ENABLED:-false}
      LESSON_SAMPLE_ENABLED: ${LESSON_SAMPLE_ENABLED:-false}
      LESSON_SAMPLE_ASSET_BASE: ${LESSON_SAMPLE_ASSET_BASE:-}
      LESSON_SAMPLE_STEP_DWELL_SEC: ${LESSON_SAMPLE_STEP_DWELL_SEC:-}
      LESSON_SAMPLE_MODE: ${LESSON_SAMPLE_MODE:-}
      COURSE_BACKEND_URL: ${COURSE_BACKEND_URL:-}
      LESSON_RENDERER_V2_ENABLED: ${LESSON_RENDERER_V2_ENABLED:-false}
      LESSON_RENDERER_V4_ENABLED: ${LESSON_RENDERER_V4_ENABLED:-false}
      LESSON_RENDERER_V5_ENABLED: ${LESSON_RENDERER_V5_ENABLED:-false}
      TBOT_REQUIRE_DEVICE_TOKEN: ${TBOT_REQUIRE_DEVICE_TOKEN:-true}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY:?set JWT_PUBLIC_KEY}
      TBOT_DEVICE_MINT_SECRET: ${TBOT_DEVICE_MINT_SECRET:?set TBOT_DEVICE_MINT_SECRET}
      LESSON_ASSET_ORIGIN_BASE: ${LESSON_ASSET_ORIGIN_BASE:?set LESSON_ASSET_ORIGIN_BASE}
      LESSON_ASSET_ALLOWED_ORIGINS: ${LESSON_ASSET_ALLOWED_ORIGINS:?set LESSON_ASSET_ALLOWED_ORIGINS}
      LESSON_SD_MAX_FILE_BYTES: ${LESSON_SD_MAX_FILE_BYTES:?set LESSON_SD_MAX_FILE_BYTES}
      LESSON_SD_MAX_PACK_BYTES: ${LESSON_SD_MAX_PACK_BYTES:?set LESSON_SD_MAX_PACK_BYTES}
      LESSON_ASSET_PUBLIC_BASE_URL: ${LESSON_ASSET_PUBLIC_BASE_URL:-}
      LESSON_ASSET_DELIVERY_MODE: ${LESSON_ASSET_DELIVERY_MODE:-}
      LESSON_MOTION_PRESETS_ENABLED: ${LESSON_MOTION_PRESETS_ENABLED:-false}
      LESSON_PLAYFUL_INTERACTIONS_ENABLED: ${LESSON_PLAYFUL_INTERACTIONS_ENABLED:-false}
      LESSON_ROLLOUT_DEVICE_ALLOWLIST: ${LESSON_ROLLOUT_DEVICE_ALLOWLIST:-}
      LESSON_STORAGE_HIL_DEVICE_ALLOWLIST: ${LESSON_STORAGE_HIL_DEVICE_ALLOWLIST:-}
      LESSON_GENERATION_CMS_URL: ${LESSON_GENERATION_CMS_URL:-}
      LESSON_GENERATION_POLL_INTERVAL_SEC: ${LESSON_GENERATION_POLL_INTERVAL_SEC:-}
      LESSON_SD_LEGACY_DEVICE_WORKER_ENABLED: ${LESSON_SD_LEGACY_DEVICE_WORKER_ENABLED:-false}
      LESSON_ASSET_PACK_LOCAL_ROOT: ${LESSON_ASSET_PACK_LOCAL_ROOT:-}
      LESSON_ASSET_PACK_MOUNT_ROOT: ${LESSON_ASSET_PACK_MOUNT_ROOT:-}
      LESSON_PRELOAD_TIMEOUT_SEC: ${LESSON_PRELOAD_TIMEOUT_SEC:-240}
      LESSON_STEP_TIMEOUT_FLOOR_SEC: ${LESSON_STEP_TIMEOUT_FLOOR_SEC:-}
      LESSON_VOICE_RT_P95_DISABLE_MS: ${LESSON_VOICE_RT_P95_DISABLE_MS:-}
      # F-T64-05: the operator assignment console at /tbot/assign/ is NOT served
      # in production unless this is exactly "true". cloudflared routes the
      # esp.tjbot.vn catch-all straight to :8003, so Nginx cannot gate it and a
      # browser cannot present X-Mint-Secret.
      LESSON_ASSIGN_CONSOLE_ENABLED: ${LESSON_ASSIGN_CONSOLE_ENABLED:-false}
      LESSON_MAX_ASSET_BYTES: ${LESSON_MAX_ASSET_BYTES:-}
      LESSON_MAX_TOTAL_ASSET_BYTES: ${LESSON_MAX_TOTAL_ASSET_BYTES:-}
    expose:
      - "8000"
      - "8003"
    healthcheck:
      test: ["CMD", "python", "-c", "import socket, urllib.request; socket.create_connection(('127.0.0.1', 8000), timeout=3).close(); urllib.request.urlopen('http://127.0.0.1:8003/tbot/ota/', timeout=3).read(1)"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 30s
    volumes:
      - ${TBOT_REMOTE_ROOT:-/opt/tbot}/data:/opt/tbot-esp32-server/data
      - ${TBOT_REMOTE_ROOT:-/opt/tbot}/models:/opt/tbot-esp32-server/models
    networks:
      - tbot

  tbot-esp32-server-web:
    image: ${TBOT_WEB_IMAGE:?set TBOT_WEB_IMAGE}
    container_name: tbot-esp32-server-web
    restart: unless-stopped
    depends_on:
      tbot-esp32-server-db:
        condition: service_healthy
      tbot-esp32-server-redis:
        condition: service_healthy
    environment:
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
      # DB host/port/user/db/password are all env-overridable (defaults keep the
      # in-stack MySQL service). Point at an external/managed MySQL by setting
      # MYSQL_HOST/MYSQL_PORT/MYSQL_USER/MYSQL_PASSWORD -- no image rebuild.
      SPRING_DATASOURCE_DRUID_URL: jdbc:mysql://${MYSQL_HOST:-tbot-esp32-server-db}:${MYSQL_PORT:-3306}/${MYSQL_DATABASE:-tbot_esp32_server}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=${MYSQL_SERVER_TIMEZONE:-Asia/Ho_Chi_Minh}&nullCatalogMeansCurrent=true&connectTimeout=30000&socketTimeout=30000&autoReconnect=true&failOverReadOnly=false&maxReconnects=10
      SPRING_DATASOURCE_DRUID_USERNAME: ${MYSQL_USER:-root}
      SPRING_DATASOURCE_DRUID_PASSWORD: ${MYSQL_PASSWORD:-${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD}}
      SPRING_DATA_REDIS_HOST: ${REDIS_HOST:-tbot-esp32-server-redis}
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      SPRING_DATA_REDIS_PORT: ${REDIS_PORT:-6379}
      # Course CMS (/nestjs) upstream backend + optional shared token. Rendered into
      # nginx at container start (start.sh). Repoint the NestJS course backend later
      # by editing these env vars and restarting -- no image rebuild.
      NESTJS_UPSTREAM_HOST: ${NESTJS_UPSTREAM_HOST:-tbot-backend-8wmh.onrender.com}
      # Was missing here while /opt/tbot/.env already set it: the container fell
      # back to start.sh's https default and spoke TLS to a plain-HTTP upstream,
      # producing "SSL_do_handshake() failed (wrong version number)" and a 502 on
      # every /nestjs/ route (all Courses / Lesson admin pages).
      NESTJS_UPSTREAM_SCHEME: ${NESTJS_UPSTREAM_SCHEME:-https}
      PUBLIC_CMS_UPSTREAM_HOST: ${PUBLIC_CMS_UPSTREAM_HOST:-${NESTJS_UPSTREAM_HOST:-tbot-backend-8wmh.onrender.com}}
      PUBLIC_CMS_UPSTREAM_SCHEME: ${PUBLIC_CMS_UPSTREAM_SCHEME:-${NESTJS_UPSTREAM_SCHEME:-https}}
      TBOT_ALLOW_SPLIT_CMS_AUTHORITY: ${TBOT_ALLOW_SPLIT_CMS_AUTHORITY:-false}
      NESTJS_TOKEN: ${NESTJS_TOKEN:-}
      NESTJS_ADMIN_PROXY_KEY: ${NESTJS_ADMIN_PROXY_KEY:-}
      # Backend-signed child-profile projection requests. The private key remains
      # backend-only; Spring receives the matching verification material.
      TBOT_PROFILE_SYNC_JWT_PUBLIC_KEY: ${TBOT_PROFILE_SYNC_JWT_PUBLIC_KEY:?set TBOT_PROFILE_SYNC_JWT_PUBLIC_KEY}
      TBOT_PROFILE_SYNC_JWT_ISSUER: ${TBOT_PROFILE_SYNC_JWT_ISSUER:-tbot-backend}
      TBOT_PROFILE_SYNC_JWT_AUDIENCE: ${TBOT_PROFILE_SYNC_JWT_AUDIENCE:-tbot-manager-api}
      CHILD_PROFILE_JWT_PUBLIC_KEY: ${TBOT_PROFILE_SYNC_JWT_PUBLIC_KEY:?set TBOT_PROFILE_SYNC_JWT_PUBLIC_KEY}
      CHILD_PROFILE_JWT_ISSUER: ${TBOT_PROFILE_SYNC_JWT_ISSUER:-tbot-backend}
      CHILD_PROFILE_JWT_AUDIENCE: ${TBOT_PROFILE_SYNC_JWT_AUDIENCE:-tbot-manager-api}
    # F-T64-05: loopback-bound for the same reason as the LB ports above — host
    # Nginx (deploy/nginx/tjbot.vn.conf) and cloudflared both reach this on
    # 127.0.0.1:8002; a 0.0.0.0 publish only adds a way around them.
    ports:
      - "127.0.0.1:${TBOT_ADMIN_PORT:-8002}:8002"
    volumes:
      - ${TBOT_REMOTE_ROOT:-/opt/tbot}/uploadfile:/uploadfile
    networks:
      tbot:
        aliases:
          - manager-api

  tbot-esp32-server-db:
    image: ${MYSQL_IMAGE:-mysql:8.4}
    container_name: tbot-esp32-server-db
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-tbot_esp32_server}
      MYSQL_INITDB_ARGS: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    expose:
      - "3306"
    volumes:
      - ${TBOT_REMOTE_ROOT:-/opt/tbot}/mysql/data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p\"$${MYSQL_ROOT_PASSWORD}\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 45s
    networks:
      - tbot

  tbot-esp32-server-redis:
    image: ${REDIS_IMAGE:-redis:8.0}
    container_name: tbot-esp32-server-redis
    restart: unless-stopped
    command:
      - sh
      - -c
      - |
        if [ -n "$$REDIS_PASSWORD" ]; then
          exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"
        fi
        exec redis-server --appendonly yes
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    expose:
      - "6379"
    volumes:
      - ${TBOT_REMOTE_ROOT:-/opt/tbot}/redis/data:/data
    healthcheck:
      test: ["CMD-SHELL", "if [ -n \"$${REDIS_PASSWORD}\" ]; then redis-cli -a \"$${REDIS_PASSWORD}\" ping; else redis-cli ping; fi"]
      interval: 10s
      timeout: 5s
      retries: 6
    networks:
      - tbot

networks:
  tbot:
    name: tbot
