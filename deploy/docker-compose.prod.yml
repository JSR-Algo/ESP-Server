version: "2.4"

services:
  tbot-wss-lb:
    image: ${HAPROXY_IMAGE:-haproxy:3.0-alpine}
    container_name: tbot-wss-lb
    restart: unless-stopped
    depends_on:
      - tbot-esp32-server
    ports:
      - "${TBOT_WS_PORT:-8000}:8000"
      - "${TBOT_HTTP_PORT:-8003}:8003"
    volumes:
      - ./haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    networks:
      - tbot

  tbot-esp32-server:
    image: ${TBOT_SERVER_IMAGE:?set TBOT_SERVER_IMAGE}
    restart: unless-stopped
    deploy:
      replicas: ${TBOT_SERVER_REPLICAS:-2}
    depends_on:
      tbot-esp32-server-db:
        condition: service_healthy
      tbot-esp32-server-redis:
        condition: service_healthy
    security_opt:
      - seccomp:unconfined
    environment:
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      TBOT_PUBLIC_WEBSOCKET_URL: ${TBOT_PUBLIC_WEBSOCKET_URL:?set TBOT_PUBLIC_WEBSOCKET_URL}
      TBOT_BACKEND_API_URL: ${TBOT_BACKEND_API_URL:?set TBOT_BACKEND_API_URL}
      TBOT_FACTORY_TEST_CLAIMED_DEVICES: ${TBOT_FACTORY_TEST_CLAIMED_DEVICES:-}
      REDIS_URL: redis://:${REDIS_PASSWORD:-}@tbot-esp32-server-redis:6379/0
      TBOT_LIVE_REDIS_NAMESPACE: ${TBOT_LIVE_REDIS_NAMESPACE:-prod}
      # Lesson runtime toggles (additive; default empty = off). LESSON_SAMPLE_ENABLED
      # turns on the built-in demo lesson that plays on the start_lesson voice trigger
      # with no backend assignment; LESSON_RUNTIME_ENABLED / COURSE_BACKEND_URL drive
      # the real assigned-lesson path. Previously unforwarded, so these env vars never
      # reached the app — set them in /opt/tbot/.env to take effect.
      LESSON_RUNTIME_ENABLED: ${LESSON_RUNTIME_ENABLED:-}
      LESSON_SAMPLE_ENABLED: ${LESSON_SAMPLE_ENABLED:-}
      LESSON_SAMPLE_ASSET_BASE: ${LESSON_SAMPLE_ASSET_BASE:-}
      COURSE_BACKEND_URL: ${COURSE_BACKEND_URL:-}
    expose:
      - "8000"
      - "8003"
    volumes:
      - ${TBOT_REMOTE_ROOT:-/opt/tbot}/data:/opt/tbot-esp32-server/data
      - ${TBOT_REMOTE_ROOT:-/opt/tbot}/models:/opt/tbot-esp32-server/models
    networks:
      - tbot

  tbot-esp32-server-web:
    image: ${TBOT_WEB_IMAGE:?set TBOT_WEB_IMAGE}
    container_name: tbot-esp32-server-web
    restart: unless-stopped
    depends_on:
      tbot-esp32-server-db:
        condition: service_healthy
      tbot-esp32-server-redis:
        condition: service_healthy
    environment:
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
      # DB host/port/user/db/password are all env-overridable (defaults keep the
      # in-stack MySQL service). Point at an external/managed MySQL by setting
      # MYSQL_HOST/MYSQL_PORT/MYSQL_USER/MYSQL_PASSWORD -- no image rebuild.
      SPRING_DATASOURCE_DRUID_URL: jdbc:mysql://${MYSQL_HOST:-tbot-esp32-server-db}:${MYSQL_PORT:-3306}/${MYSQL_DATABASE:-tbot_esp32_server}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=${MYSQL_SERVER_TIMEZONE:-Asia/Ho_Chi_Minh}&nullCatalogMeansCurrent=true&connectTimeout=30000&socketTimeout=30000&autoReconnect=true&failOverReadOnly=false&maxReconnects=10
      SPRING_DATASOURCE_DRUID_USERNAME: ${MYSQL_USER:-root}
      SPRING_DATASOURCE_DRUID_PASSWORD: ${MYSQL_PASSWORD:-${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD}}
      SPRING_DATA_REDIS_HOST: ${REDIS_HOST:-tbot-esp32-server-redis}
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      SPRING_DATA_REDIS_PORT: ${REDIS_PORT:-6379}
      # Course CMS (/nestjs) upstream backend + optional shared token. Rendered into
      # nginx at container start (start.sh). Repoint the NestJS course backend later
      # by editing these env vars and restarting -- no image rebuild.
      NESTJS_UPSTREAM_HOST: ${NESTJS_UPSTREAM_HOST:-tbot-backend-8wmh.onrender.com}
      NESTJS_TOKEN: ${NESTJS_TOKEN:-}
    ports:
      - "${TBOT_ADMIN_PORT:-8002}:8002"
    volumes:
      - ${TBOT_REMOTE_ROOT:-/opt/tbot}/uploadfile:/uploadfile
    networks:
      - tbot

  tbot-esp32-server-db:
    image: ${MYSQL_IMAGE:-mysql:8.4}
    container_name: tbot-esp32-server-db
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-tbot_esp32_server}
      MYSQL_INITDB_ARGS: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    expose:
      - "3306"
    volumes:
      - ${TBOT_REMOTE_ROOT:-/opt/tbot}/mysql/data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p\"$${MYSQL_ROOT_PASSWORD}\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 45s
    networks:
      - tbot

  tbot-esp32-server-redis:
    image: ${REDIS_IMAGE:-redis:8.0}
    container_name: tbot-esp32-server-redis
    restart: unless-stopped
    command:
      - sh
      - -c
      - |
        if [ -n "$$REDIS_PASSWORD" ]; then
          exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"
        fi
        exec redis-server --appendonly yes
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    expose:
      - "6379"
    volumes:
      - ${TBOT_REMOTE_ROOT:-/opt/tbot}/redis/data:/data
    healthcheck:
      test: ["CMD-SHELL", "if [ -n \"$${REDIS_PASSWORD}\" ]; then redis-cli -a \"$${REDIS_PASSWORD}\" ping; else redis-cli ping; fi"]
      interval: 10s
      timeout: 5s
      retries: 6
    networks:
      - tbot

networks:
  tbot:
    name: tbot
