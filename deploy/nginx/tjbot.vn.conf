map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

limit_req_zone $binary_remote_addr zone=lesson_public_read:10m rate=60r/m;

server {
    listen 80;
    server_name admin.tjbot.vn;

    location / {
        proxy_pass http://127.0.0.1:8002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    server_name esp.tjbot.vn;

    location = /public/lesson-assets/generation {
        if ($request_method !~ ^(GET|HEAD)$) { return 405; }
        limit_req zone=lesson_public_read burst=10 nodelay;
        access_log off;
        proxy_pass http://127.0.0.1:8003;
        proxy_http_version 1.1;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization "";
        proxy_set_header Cookie "";
        proxy_set_header X-Admin-Key "";
        proxy_set_header X-Admin-Proxy-Key "";
        proxy_set_header X-Api-Key "";
        proxy_set_header Cf-Access-Jwt-Assertion "";
        proxy_set_header Cf-Access-Client-Id "";
        proxy_set_header Cf-Access-Client-Secret "";
    }

    location = /v1/public/lesson-assets/latest {
        if ($request_method !~ ^(GET|HEAD)$) { return 405; }
        limit_req zone=lesson_public_read burst=10 nodelay;
        access_log off;
        # Task16 must publish the CMS as 127.0.0.1:3000:3000 (loopback-only).
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization "";
        proxy_set_header Cookie "";
        proxy_set_header X-Admin-Key "";
        proxy_set_header X-Admin-Proxy-Key "";
        proxy_set_header X-Api-Key "";
        proxy_set_header Cf-Access-Jwt-Assertion "";
        proxy_set_header Cf-Access-Client-Id "";
        proxy_set_header Cf-Access-Client-Secret "";
    }

    location /tbot/ota/ {
        proxy_pass http://127.0.0.1:8003;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /tbot/v1/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /internal/ {
        proxy_pass http://127.0.0.1:8003;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /mcp/vision/ {
        proxy_pass http://127.0.0.1:8003;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
