map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

# Cloudflared forwards public traffic through one Docker gateway address. The
# canonical URI keeps each public route separate while sharing a bounded bucket
# across both hostnames; an arbitrary Host cannot allocate a fresh bucket.
limit_req_zone "$uri" zone=lesson_public_egress:1m rate=100r/s;

# Both public hostnames serve identical canonical generation bytes. A constant
# cache key deliberately shares one 15-second entry and ignores query strings.
proxy_cache_path /var/cache/nginx/lesson-generation levels=1:2 keys_zone=lesson_generation:1m max_size=16m inactive=5m use_temp_path=off;

server {
    listen 80;
    server_name admin.tjbot.vn;

    location = /public/lesson-assets/generation {
        if ($request_method !~ ^(GET|HEAD)$) { return 405; }
        access_log off;
        limit_req zone=lesson_public_egress burst=180 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8003;
        proxy_http_version 1.1;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header If-None-Match $http_if_none_match;
        proxy_set_header Authorization "";
        proxy_set_header Cookie "";
        proxy_set_header X-Admin-Key "";
        proxy_set_header X-Admin-Proxy-Key "";
        proxy_set_header X-Api-Key "";
        proxy_set_header Cf-Access-Jwt-Assertion "";
        proxy_set_header Cf-Access-Client-Id "";
        proxy_set_header Cf-Access-Client-Secret "";
    }

    location = /v1/public/lesson-assets/latest {
        if ($request_method !~ ^(GET|HEAD)$) { return 405; }
        access_log off;
        limit_req zone=lesson_public_egress burst=180 nodelay;
        limit_req_status 429;
        proxy_cache lesson_generation;
        proxy_cache_key "lesson-assets-latest";
        proxy_cache_valid 200 15s;
        proxy_cache_lock on;
        proxy_cache_lock_timeout 5s;
        proxy_cache_lock_age 5s;
        proxy_cache_background_update on;
        proxy_cache_revalidate on;
        proxy_cache_use_stale updating error timeout http_500 http_502 http_503 http_504;
        # The public body is origin-independent. Do not let an upstream CORS
        # echo create attacker-selected cache variants or cached credentials.
        proxy_ignore_headers Vary;
        proxy_hide_header Vary;
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Credentials;
        proxy_set_header Origin "";
        add_header Access-Control-Allow-Origin "*" always;
        # The authoritative lesson CMS is bound to the VPS loopback interface.
        proxy_pass http://127.0.0.1:3003;
        proxy_http_version 1.1;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Let nginx evaluate client conditionals after it has cached a full 200.
        proxy_set_header If-None-Match "";
        proxy_set_header Accept-Encoding "identity";
        proxy_set_header Authorization "";
        proxy_set_header Cookie "";
        proxy_set_header X-Admin-Key "";
        proxy_set_header X-Admin-Proxy-Key "";
        proxy_set_header X-Api-Key "";
        proxy_set_header Cf-Access-Jwt-Assertion "";
        proxy_set_header Cf-Access-Client-Id "";
        proxy_set_header Cf-Access-Client-Secret "";
    }

    location / {
        proxy_pass http://127.0.0.1:8002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    server_name esp.tjbot.vn;

    location = /lesson-sample-assets {
        if ($request_method !~ ^(GET|HEAD)$) { return 405; }
        return 404;
    }

    location ~ ^/lesson-sample-assets/(?:[A-Za-z0-9][A-Za-z0-9._-]*/)*(?<sample_asset_basename>[A-Za-z0-9][A-Za-z0-9._-]*)$ {
        if ($request_uri ~* "^/lesson-sample-assets/[^?]*(?:%2f|%5c|%2e|\\\\)") { return 404; }
        if ($request_uri ~ "^/lesson-sample-assets/(?:[^/?]+/)*\.\.(?:/|\?|$)") { return 404; }
        if ($request_method !~ ^(GET|HEAD)$) { return 405; }
        alias /var/www/tbot-sample-assets/$sample_asset_basename;
        disable_symlinks on from=/var/www/tbot-sample-assets;
        autoindex off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /public/lesson-assets/generation {
        if ($request_method !~ ^(GET|HEAD)$) { return 405; }
        access_log off;
        limit_req zone=lesson_public_egress burst=180 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8003;
        proxy_http_version 1.1;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization "";
        proxy_set_header Cookie "";
        proxy_set_header X-Admin-Key "";
        proxy_set_header X-Admin-Proxy-Key "";
        proxy_set_header X-Api-Key "";
        proxy_set_header Cf-Access-Jwt-Assertion "";
        proxy_set_header Cf-Access-Client-Id "";
        proxy_set_header Cf-Access-Client-Secret "";
    }

    location = /v1/public/lesson-assets/latest {
        if ($request_method !~ ^(GET|HEAD)$) { return 405; }
        access_log off;
        limit_req zone=lesson_public_egress burst=180 nodelay;
        limit_req_status 429;
        proxy_cache lesson_generation;
        proxy_cache_key "lesson-assets-latest";
        proxy_cache_valid 200 15s;
        proxy_cache_lock on;
        proxy_cache_lock_timeout 5s;
        proxy_cache_lock_age 5s;
        proxy_cache_background_update on;
        proxy_cache_revalidate on;
        proxy_cache_use_stale updating error timeout http_500 http_502 http_503 http_504;
        # Normalize public CORS on every response served through the shared cache.
        proxy_ignore_headers Vary;
        proxy_hide_header Vary;
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Credentials;
        proxy_set_header Origin "";
        add_header Access-Control-Allow-Origin "*" always;
        # The authoritative lesson CMS is bound to the VPS loopback interface.
        proxy_pass http://127.0.0.1:3003;
        proxy_http_version 1.1;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header If-None-Match "";
        proxy_set_header Accept-Encoding "identity";
        proxy_set_header Authorization "";
        proxy_set_header Cookie "";
        proxy_set_header X-Admin-Key "";
        proxy_set_header X-Admin-Proxy-Key "";
        proxy_set_header X-Api-Key "";
        proxy_set_header Cf-Access-Jwt-Assertion "";
        proxy_set_header Cf-Access-Client-Id "";
        proxy_set_header Cf-Access-Client-Secret "";
    }

    location /tbot/ota/ {
        proxy_pass http://127.0.0.1:8003;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /tbot/v1/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /internal/ {
        proxy_pass http://127.0.0.1:8003;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /mcp/vision/ {
        proxy_pass http://127.0.0.1:8003;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
