map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

limit_req_zone $binary_remote_addr zone=lesson_public_read:10m rate=60r/m;

server {
    listen 80;
    server_name admin.tjbot.vn;

    location = /public/lesson-assets/generation {
        if ($request_method !~ ^(GET|HEAD)$) { return 405; }
        limit_req zone=lesson_public_read burst=10 nodelay;
        access_log off;
        proxy_pass http://127.0.0.1:8003;
        proxy_http_version 1.1;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header If-None-Match $http_if_none_match;
        proxy_set_header Authorization "";
        proxy_set_header Cookie "";
        proxy_set_header X-Admin-Key "";
        proxy_set_header X-Admin-Proxy-Key "";
        proxy_set_header X-Api-Key "";
        proxy_set_header Cf-Access-Jwt-Assertion "";
        proxy_set_header Cf-Access-Client-Id "";
        proxy_set_header Cf-Access-Client-Secret "";
    }

    location = /v1/public/lesson-assets/latest {
        if ($request_method !~ ^(GET|HEAD)$) { return 405; }
        limit_req zone=lesson_public_read burst=10 nodelay;
        access_log off;
        # CMS is published on host loopback 3300 to avoid unrelated host port 3000.
        proxy_pass http://127.0.0.1:3300;
        proxy_http_version 1.1;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header If-None-Match $http_if_none_match;
        proxy_set_header Authorization "";
        proxy_set_header Cookie "";
        proxy_set_header X-Admin-Key "";
        proxy_set_header X-Admin-Proxy-Key "";
        proxy_set_header X-Api-Key "";
        proxy_set_header Cf-Access-Jwt-Assertion "";
        proxy_set_header Cf-Access-Client-Id "";
        proxy_set_header Cf-Access-Client-Secret "";
    }

    location / {
        proxy_pass http://127.0.0.1:8002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    server_name esp.tjbot.vn;

    location = /lesson-sample-assets {
        if ($request_method !~ ^(GET|HEAD)$) { return 405; }
        return 404;
    }

    location ~ ^/lesson-sample-assets/(?:[A-Za-z0-9][A-Za-z0-9._-]*/)*(?<sample_asset_basename>[A-Za-z0-9][A-Za-z0-9._-]*)$ {
        if ($request_uri ~* "^/lesson-sample-assets/[^?]*(?:%2f|%5c|%2e|\\\\)") { return 404; }
        if ($request_uri ~ "^/lesson-sample-assets/(?:[^/?]+/)*\.\.(?:/|\?|$)") { return 404; }
        if ($request_method !~ ^(GET|HEAD)$) { return 405; }
        alias /var/www/tbot-sample-assets/$sample_asset_basename;
        autoindex off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /public/lesson-assets/generation {
        if ($request_method !~ ^(GET|HEAD)$) { return 405; }
        limit_req zone=lesson_public_read burst=10 nodelay;
        access_log off;
        proxy_pass http://127.0.0.1:8003;
        proxy_http_version 1.1;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization "";
        proxy_set_header Cookie "";
        proxy_set_header X-Admin-Key "";
        proxy_set_header X-Admin-Proxy-Key "";
        proxy_set_header X-Api-Key "";
        proxy_set_header Cf-Access-Jwt-Assertion "";
        proxy_set_header Cf-Access-Client-Id "";
        proxy_set_header Cf-Access-Client-Secret "";
    }

    location = /v1/public/lesson-assets/latest {
        if ($request_method !~ ^(GET|HEAD)$) { return 405; }
        limit_req zone=lesson_public_read burst=10 nodelay;
        access_log off;
        # CMS is published on host loopback 3300 to avoid unrelated host port 3000.
        proxy_pass http://127.0.0.1:3300;
        proxy_http_version 1.1;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization "";
        proxy_set_header Cookie "";
        proxy_set_header X-Admin-Key "";
        proxy_set_header X-Admin-Proxy-Key "";
        proxy_set_header X-Api-Key "";
        proxy_set_header Cf-Access-Jwt-Assertion "";
        proxy_set_header Cf-Access-Client-Id "";
        proxy_set_header Cf-Access-Client-Secret "";
    }

    location /tbot/ota/ {
        proxy_pass http://127.0.0.1:8003;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /tbot/v1/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /internal/ {
        proxy_pass http://127.0.0.1:8003;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /mcp/vision/ {
        proxy_pass http://127.0.0.1:8003;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
