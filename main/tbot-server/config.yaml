  CustomTTS:
    # Custom TTS API service with customizable request parameters; supports multiple TTS integrations
    # Example: locally deployed KokoroTTS
    # If running on CPU only: docker run -p 8880:8880 ghcr.io/remsky/kokoro-fastapi-cpu:latest
    # If running on GPU only: docker run --gpus all -p 8880:8880 ghcr.io/remsky/kokoro-fastapi-gpu:latest
    # Requires POST request returning audio file
    type: custom
    method: POST
    url: "http://127.0.0.1:8880/v1/audio/speech"
    params: # Custom request params
      input: "{prompt_text}"
      response_format: "mp3"
      download_format: "mp3"
      voice: "zf_xiaoxiao"
      lang_code: "z"
      return_download_link: true
      speed: 1
      stream: false
    headers: # Custom request headers
      # Authorization: Bearer xxxx
    format: mp3 # Audio format returned by API
    output_dir: tmp/
    # language: "English"  # Specify output language,e.g.:English, Japanese, Korean, etc.,Please configure according to the languages supported by the selected voice,Defaults to English if left empty
  PaddleSpeechTTS:
    #Baidu PaddleSpeech. Supports local offline deployment and model training.
    #Framework URL https://www.paddlepaddle.org.cn/
    #Project URL https://github.com/PaddlePaddle/PaddleSpeech
    #SpeechServerDemo https://github.com/PaddlePaddle/PaddleSpeech/tree/develop/demos/speech_server
    #For streaming, refer to https://github.com/PaddlePaddle/PaddleSpeech/wiki/PaddleSpeech-Server-WebSocket-API
    type: paddle_speech
    protocol: websocket # protocol choices = ['websocket', 'http']
    url: ws://127.0.0.1:8092/paddlespeech/tts/streaming  # TTS Service URL, pointing to local server [websocketDefault WS://127.0.0.1:8092/paddlespeech/tts/streaming，httpDefault HTTP://127.0.0.1:8090/paddlespeech/tts]
    spk_id: 0  # Voice ID, 0 usually represents the default voice
    speed: 1.0  # Speech rate, 1.0 indicates normal speed,>1 Indicates speedup,<1 Indicates slowdown
    volume: 1.0  # Volume, 1.0 indicates normal volume,>1 Indicates increase,<1 Indicates decrease
