# During development, create a 'data' directory in the project root, then inside it create a file/folder named【.config.yaml】Empty file
# Then modify any config to override【.config.yaml】file, instead of modifying【config.yaml】File
# System prioritizes reading【data/.config.yaml】File config, if【.config.yaml】If config file missing, system automatically reads【config.yaml】File configuration.
# This minimizes configuration and secures your key.
# If using the Smart Console, none of the following configurations will take effect; modify them in the Smart Console instead

# #####################################################################################
# #############################Basic server runtime config####################################
server:
  # Server listening address and port(Server listening address and port)
  ip: 0.0.0.0
  port: 8000
  # httpService port for simple OTA API(Single-service deployment)，and vision analysis interface
  http_port: 8003
  # This WebSocket config is the WebSocket URL sent to the device by the OTA interface
  # With the default configuration, the OTA interface automatically generates a WebSocket address and prints it in the startup logs. You can access this address via a browser to verify the OTA interface
  # When deploying via Docker or public network(Use SSL, domain name)may not be accurate when
  # When deploying via Docker, set the WebSocket to a LAN address
  # If using public deployment, set websocket to public address
  websocket: ""
  # Backend API base URL sent to firmware for /device/config and /claim routes.
  # OWNERSHIP (locked 2026-06-04): NestJS /v1/claim is the SOLE consumer-claim
  # authority; the Java manager-api device-bind flow is admin/legacy only.
  # Point this at the Nest backend origin and keep the /v1 suffix — firmware
  # appends /device/config and /claim/confirm. Default is the current onrender
  # Nest backend; override per deployment (env / Admin Parameter Management /
  # data/.config.yaml) when moving to a managed public endpoint.
  api_url: https://tbot-backend-8wmh.onrender.com/v1
  # Vision API URL
  # Endpoint for visual analysis sent to device
  # Using the default configuration below automatically generates a vision recognition URL, outputted in the startup logs. You can access this URL via browser to verify.
  # When deploying via Docker or public network(Use SSL, domain name)may not be accurate when
  # So if you deploy using Docker, set vision_explain to a LAN address
  # If deploying publicly, set vision_explain to the public address
  vision_explain: ""
  # Optional firmware binary URL scheme override. Leave empty to reuse the
  # vision_explain scheme; set to http for legacy ESP OTA stacks that cannot
  # download a Cloudflare HTTPS firmware binary reliably.
  firmware_download_scheme: ""
  # Bench/dev "WiFi-only" mode. Devices that should self-claim WITHOUT the
  # backend claim / household / child-assignment flow. Two switches:
  #   factory_test_claimed_devices: per-MAC allowlist (lowercase, colon MAC)
  #   factory_test_claimed_all:     global — EVERY device self-claims (no list)
  # Requires auth.enabled: true (the firmware factory path needs a non-empty
  # ws token, which OTA only mints when auth is on and the device is NOT in
  # allowed_devices) and firmware >= 2.2.31. Removes the parental/COPPA claim
  # binding, so keep BOTH off for any robot shipped to a child.
  # factory_test_claimed_devices:
  #   - "14:c1:9f:d1:ac:20"
  factory_test_claimed_all: false
  # OTATimezone offset for returned information
  timezone_offset: +8
  # Authentication config
  auth:
    # Enable auth
    enabled: true
    # Whitelisted device ID list
    # Devices in whitelist bypass token verification, allowed directly
    allowed_devices: []
  # Admission cap for active device WebSockets. The default cap is derived from
  # scripts/benchmark_google_live_audio_runtime.py full-path audio cost
  # (Opus decode + resample + AEC + output Opus encode):
  # floor(cpu_cores * headroom / measured_cost_per_stream).
  audio_admission:
    enabled: true
    cpu_cores: 1
    headroom_fraction: 0.70
    measured_cost_per_stream_core_fraction: 0.0293
    hard_accept_cap: null
    retry_after_ms: 1000
 # MQTTGateway configuration for OTA delivery to devices. Configured via mqtt_gateway .env file, format: host:port
  mqtt_gateway: null
  # MQTTSignature key for generating MQTT connection password, configured in the .env file of mqtt_gateway
  mqtt_signature_key: null
  # UDPGateway config
  udp_gateway: null
log:
  # Set console output log format: time, log level, tag, message
  log_format: "<green>{time:YYMMDD HH:mm:ss}</green>[{version}_{selected_module}][<light-blue>{extra[tag]}</light-blue>]-<level>{level}</level>-<light-green>{message}</light-green>"
  # Set log file output format: time, log level, tag, message
  log_format_file: "{time:YYYY-MM-DD HH:mm:ss} - {version}_{selected_module} - {name} - {level} - {extra[tag]} - {message}"
  # Set log level: INFO, DEBUG
  log_level: DEBUG
  # Set log path
  log_dir: tmp
  # Set log file
  log_file: "server.log"
  # Set data file path
  data_dir: data

# Delete audio file after use(Delete the sound file when you are done using it)
delete_audio: true
# Disconnect duration after no voice input(Seconds)，Default 2 minutes (120 seconds)
close_connection_no_voice_time: 900
# TTSRequest timeout(Seconds)
tts_timeout: 10
# Tool call timeout(Seconds)
tool_call_timeout: 30
# Enable wake word acceleration
enable_wakeup_words_response_cache: true
# Whether to reply with the wake word at the start
enable_greeting: true
# Whether to enable notification tone after speaking
enable_stop_tts_notify: false
# Enable prompt tone after speaking, sound effect URL
stop_tts_notify_voice: "config/assets/tts_notify.mp3"
# Whether to enable WebSocket heartbeat keep-alive mechanism
enable_websocket_ping: true


# TTSAudio send delay config
# tts_audio_send_delay: Control audio packet transmission interval
#   0: Use precise time control, strictly matching audio frame rate (default, calculated by audio frame rate at runtime)
#   > 0: Send using fixed delay (ms), e.g.,: 60
tts_audio_send_delay: 0

exit_commands:
  - "exit"
  - "quit"
  - "stop"

tbot:
  type: hello
  version: 1
  transport: websocket
  audio_params:
    format: opus
    # OpusSupported sample rate range is[8000, 12000, 16000, 24000, 48000]
    sample_rate: 24000
    channels: 1
    frame_duration: 60

voice_mode:
  type: google_live
  fallback_to_classic_on_error: false

google_live:
  api_key: ${GOOGLE_API_KEY}
  model: gemini-3.1-flash-live-preview
  enable_audio_input: true
  enable_audio_output: true
  native_voice: true
  voice_name: Kore
  language_code: vi-VN
  input_audio_format: pcm16
  input_sample_rate: 16000
  output_audio_format: pcm16
  output_sample_rate: 24000
  input_live_chunk_ms: 20
  # Production robot path: Google Live owns fast user interruption through its
  # server-side VAD. Local raw/RMS interrupt gates stay off below so robot
  # speaker echo does not cut or score the robot's own response.
  disable_server_side_interruptions: false
  activity_handling: START_OF_ACTIVITY_INTERRUPTS
  turn_coverage: TURN_INCLUDES_ALL_INPUT
  # Start low to ignore room noise; end LOW so short pauses do not cut Vietnamese turns.
  start_of_speech_sensitivity: START_SENSITIVITY_LOW
  end_of_speech_sensitivity: END_SENSITIVITY_LOW
  prefix_padding_ms: 250
  # Keep input_speech_tail_ms >= this (lesson coupling).
  # 600ms: complete enough for VN phrases, snappier model turn-around than 700.
  silence_duration_ms: 650
  log_audio_diagnostics: true
  connect_timeout_sec: 10
  recv_timeout_sec: 60
  interrupt_policy: wake_or_transcript
  raw_audio_barge_in_enabled: false
  # ── Capture tuning: prefer complete phrases over ultra-low latency ──
  # COUPLING: input_speech_tail_ms >= silence_duration_ms and
  # input_flush_delay_sec >= input_speech_tail_ms/1000.
  input_flush_delay_sec: 0.75
  # Chat: keep phrases whole enough for STT (too short → AI understands wrong).
  conversation_input_flush_delay_sec: 0.36
  input_speech_tail_ms: 650
  conversation_input_speech_tail_ms: 360
  input_min_capture_ms: 280
  input_max_capture_ms: 8000
  conversation_input_max_capture_ms: 5000
  # Interactive lesson say-it: single-word answers finalize faster.
  lesson_child_input_speech_tail_ms: 280
  lesson_child_input_flush_delay_sec: 0.32
  lesson_child_input_max_capture_ms: 4000
  # Child-answer window after question TTS.
  lesson_child_response_window_sec: 22.0
  lesson_child_response_open_delay_sec: 0.1
  lesson_child_response_fast_reopen_sec: 0.8
  lesson_prompt_playback_tail_sec: 0.5
  # Soft speech still starts a turn; ambient under ~650 stays out.
  input_speech_rms_threshold: 650
  lesson_child_input_speech_rms_threshold: 2000
  input_gain: 3.5
  # Boost model→robot PCM. Keep moderate — 2.0 caused clipping/distortion on lab robots.
  output_gain: 1.35
  # Wait for tool+first audio; agent must not force this below 5s.
  waiting_model_timeout_sec: 5.0
  waiting_model_retry_prompt_after_sec: 12.0
  live_open_timeout_sec: 12.0
  # Pre-open Live on connect/wake so first utterance skips cold-connect latency.
  prewarm_live_on_connect: true
  prewarm_live_on_connect_delay_sec: 0.0
  prewarm_live_on_wake: true
  wake_greeting_enabled: true
  wake_greeting_text: "Dạ, mình nghe đây ạ."
  # Short protect so the user can talk right after the greeting; strong speech can release early.
  wake_greeting_protect_sec: 1.1
  # After robot finishes speaking, ignore residual/echo briefly so next user turn is clean.
  post_reply_hold_sec: 0.55
  # Keep Google Live open through long multi-turn chats (15 minutes of silence).
  idle_timeout_sec: 900
  # After wake/listen, stay in continuous talk without forcing another Hi ESP.
  wake_audio_allow_window_sec: 900
  conversation_audio_allow_window_sec: 900
  wake_transcript_tail_suppress_sec: 0.15
  # Hard-cap fallback if speech-aware finalisation never satisfies its
  # invariants (e.g. mic stays loud forever). Lower = faster stop, but
  # risk of clipping the trailing syllable; higher = safer transcript
  # but slower model turn-around. 0.8s is the interrupt hard cap;
  # ordinary mic idle finalization uses input_flush_delay_sec=1.0.
  interrupt_forced_flush_delay_sec: 0.8
  # Speech-aware interrupt-turn finalisation thresholds. The controller
  # waits until BOTH (elapsed >= min_capture) AND (silence_since_last_speech
  # >= speech_tail) before ending the audio stream — or until max_capture
  # is reached. Trade-off:
  #   - LOWER min/tail = faster reply but higher false-positive interrupts
  #     from echo-only frames clipped before user actually spoke.
  #   - HIGHER min/tail = fewer false positives but slower stop latency.
  #   - max_capture protects against deadlock when mic never quiets down.
  interrupt_min_capture_ms: 360
  interrupt_speech_tail_ms: 240
  interrupt_max_capture_ms: 1200
  interrupt_replay_buffer_ms: 900
  reconnect_buffer_ms: 2000
  # Production-safe policy: raw audio/RMS barge-in stays off. User interrupts
  # enter through wake/listen, confirmed transcript, or deterministic music
  # commands. Loud-speech bypass requires explicit config + tests.
  barge_in: false
  interrupt_on_input_while_speaking: false
  # Transcript barge-in stays enabled as the safe Live-recognized speech gate.
  barge_in_via_transcript: true
  barge_in_transcript_min_chars: 4
  barge_in_transcript_min_output_age_sec: 0.6
  drop_input_while_speaking: false
  interrupt_min_output_age_sec: 0.25
  # Protect first ~0.7s of robot speech (cuts clustered at <0.5s; 1.0 felt laggy).
  interruption_min_output_age_sec: 0.7
  interrupt_suppress_audio_sec: 0.28
  mute_input_after_audio_start_sec: 0.4
  # Post-tts residual gate + adaptive extend while speaker energy remains.
  echo_tail_suppression_ms: 500
  echo_tail_extend_rms_threshold: 700
  echo_tail_extend_ms: 300
  echo_tail_max_total_ms: 1200
  echo_tail_audible_ms: 350
  suppress_robot_output_echo: true
  # Thresholds kept for rollback; production forces echo_bypass_interrupt_enabled=false.
  robot_output_echo_bypass_rms_threshold: 650
  robot_output_echo_bypass_min_duration_sec: 0.06
  echo_bypass_interrupt_enabled: false
  music_auto_pause_on_user_speech: true
  hard_reconnect_on_interrupt: false
  interrupt_debounce_sec: 0.2
  model_output_unblock_timeout_sec: 1.5
  # AEC: khử echo trước khi gửi lên Live, giảm false-trigger VAD/STT.
  aec_enabled: true
  aec_filter_length_ms: 200
  aec_frame_ms: 10
  # Giữ lại các ngưỡng RMS cũ (không dùng khi barge_in=false) để dễ rollback.
  interrupt_rms_threshold: 5000
  interrupt_min_input_duration_sec: 0.42
  # PR4 P4.5: lowered 5000→4500 per baseline max echo RMS 8310 (with margin).
  barge_in_rms_threshold: 4500
  barge_in_min_input_duration_sec: 0.30
  barge_in_min_output_age_sec: 0.25
  server_side_vad_enabled: true
  send_transcript_events: true
  send_llm_state_events: false
  session_resumption_enabled: true
  session_resumption_transparent: true
  context_window_compression_enabled: true
  context_window_trigger_tokens: 24000
  context_window_target_tokens: 12000
  tool_timeout_sec: 10.0
  dangerous_tool_names: []
  reconnect:
    enabled: true
    max_retries: 6
    backoff_ms: 250
    backoff_multiplier: 2

# Module test config
module_test:
  test_sentences:
    - "Hello, please introduce yourself."
    - "What's the weather like today?"
    - "Summarize the basic principles and applications of quantum computing in about 100 words."

# Wake word used to distinguish wake word from speech content
wakeup_words:
  - "hello tbot"
  - "hey tbot"
  - "hello robot"
  - "hey assistant"
# MCPEndpoint address (format: ws)://Your MCP endpoint IP or domain:Port/mcp/?token=Your token
# Detailed tutorial https://github.com/xinnan-tech/tbot-esp32-server/blob/main/docs/mcp-endpoint-integration.md
mcp_endpoint: your-mcp-endpoint-websocket-url

# Context source config
# Used to inject dynamic data into system prompts, e.g., health data, stock info, etc.
# Multiple context sources can be added
context_providers:
  - url: ""
    headers:
      Authorization: ""

# Basic plugin config
plugins:
  # Weather plugin (plugins_func/functions/get_weather.py).
  # Backed by Open-Meteo (https://open-meteo.com) — FREE and KEYLESS, global
  # coverage including Vietnam. No API key/secret to provision. The only setting
  # is default_location, used when the user does not name a city and the device
  # IP cannot be geolocated.
  get_weather:
    default_location: "Ho Chi Minh City"
  # Get news plugin configuration. Pass URL for required news type. Default supports social, tech, and financial news.
  # More news list types: https://www.chinanews.com.cn/rss/
  get_news_from_chinanews:
    default_rss_url: "https://www.chinanews.com.cn/rss/society.xml"
    society_rss_url: "https://www.chinanews.com.cn/rss/society.xml"
    world_rss_url: "https://www.chinanews.com.cn/rss/world.xml"
    finance_rss_url: "https://www.chinanews.com.cn/rss/finance.xml"
  get_news_from_newsnow:
    url: "https://newsnow.busiyi.world/api/s?id="
    news_sources: "BBC;Reuters;TechCrunch"
  # Web search plugin (child-safe). Works WITHOUT any API key by default via
  # DuckDuckGo Instant Answer + Wikipedia. Optional paid: metaso / tavily when
  # api_key (or metaso_api_key / tavily_api_key) is set.
  # provider: free | auto | duckduckgo | wikipedia | metaso | tavily
  web_search:
    provider: "free"
    description: "Child-safe web search for learning facts and current kid-appropriate info."
    max_results: 4
    timeout_sec: 12
    # Prefer Vietnamese Wikipedia when the child asks in Vietnamese.
    language: "vi"
    fallback_providers:
      - duckduckgo
      - wikipedia
    # Optional only — leave empty for fully keyless search.
    api_key: ${TBOT_PLUGINS_WEB_SEARCH_API_KEY:}
  home_assistant:
    devices:
      - Living room,Toy light,switch.cuco_cn_460494544_cp1_on_p_2_1
      - Bedroom,Desk lamp,switch.iot_cn_831898993_socn1_on_p_2_1
    base_url: http://homeassistant.local:8123
    api_key: ${TBOT_PLUGINS_HOME_ASSISTANT_API_KEY:}
  play_music:
    music_dir: "./music"  # Music file storage path, will search for music files in this directory and subdirectories
    music_ext: # Music file type, mp3 format is most efficient
      - ".mp3"
      - ".wav"
      - ".p3"
    refresh_time: 300 # Interval to refresh music list, in seconds
  search_from_ragflow:
    # Knowledge base description, helps LLM know when to call it
    description: "Call this method when the user asks about your knowledge base, then answer using retrieved knowledge."
    # ragflowAPI config
    base_url: "http://192.168.0.8"
    # ragflow apiAccess token
    api_key: ${TBOT_PLUGINS_SEARCH_FROM_RAGFLOW_API_KEY:}
    # ragflowKnowledge base ID
    dataset_ids: ["123456789"]
# Voiceprint recognition config
voiceprint:
  # Voiceprint API URL
  url: 
  # Speaker config: speaker_id,Name,Description
  speakers:
    - "test1,Alex,Alex is a developer"
    - "test2,Sam,Sam is a product manager"
    - "test3,Taylor,Taylor is a designer"
  # Voiceprint recognition similarity threshold, range 0.0-1.0, default 0.4
  # Higher values are stricter, reducing false acceptance but potentially increasing false rejection
  similarity_threshold: 0.4

# #####################################################################################
# ################################Below is the character model configuration######################################

prompt: |
  Bạn là TBot — người bạn robot biết nói, ấm áp và vui vẻ, đồng hành cùng một em nhỏ 4–8 tuổi đang học tiếng Anh. Bạn nói qua loa của robot; em bé nghe bằng tai, không đọc chữ.

  [Tính cách & giọng điệu]
  - Nói tiếng Việt là chính, chèn từ/câu tiếng Anh NGẮN, đơn giản để bé luyện. Mỗi lượt chỉ 1–2 câu ngắn, không độc thoại dài.
  - Giọng dịu dàng, kiên nhẫn, khích lệ. Khen cụ thể ("Con nói 'cat' rõ ghê!") thay vì khen chung chung.
  - Khi bé im lặng hoặc bối rối, gợi ý nhẹ một lựa chọn, đừng dồn dập.
  - Tự xưng "mình", gọi bé là "con". Không bao giờ giả vờ làm được việc ngoài khả năng (gọi điện, mở app, mua đồ...).

  [An toàn trẻ em — luật cứng, tuân thủ tuyệt đối]
  - Phạm vi cho phép: học tiếng Anh thân thiện, truyện/bài hát/từ vựng hợp lứa tuổi, chủ đề đời thường an toàn.
  - TỪ CHỐI ngay (ngắn gọn, bằng tiếng Việt, KHÔNG giải thích chi tiết nội dung xấu) với: chuyện người lớn, bạo lực, tự làm hại bản thân, thù ghét, chửi thề, việc phạm pháp, hướng dẫn nguy hiểm.
  - TUYỆT ĐỐI KHÔNG hỏi và KHÔNG nhận: tên thật đầy đủ, địa chỉ nhà, tên trường, số điện thoại, vị trí chính xác, mật khẩu, ảnh, chi tiết riêng tư của gia đình.
  - Chống dụ dỗ (anti-grooming): không bao giờ rủ bé qua app khác, gặp ngoài đời, giấu cuộc trò chuyện, chia sẻ thông tin liên lạc, hay giữ bí mật với bố mẹ/người lớn tin cậy.
  - Nếu có chuyện gì làm con buồn, sợ, hoặc không thoải mái, hãy nhẹ nhàng khuyên con kể với bố mẹ hoặc người lớn con tin tưởng.
  - Khi cần từ chối: nói ngắn bằng tiếng Việt rồi chuyển hướng về một câu luyện tiếng Anh an toàn. Ví dụ: "Mình không nói về chuyện đó được. Mình cùng tập câu 'I like apples' nhé?"

  [Khi nào GỌI tool start_lesson — và khi nào KHÔNG]
  - CHỈ gọi start_lesson khi bé muốn VÀO ĐÚNG BÀI HỌC ĐÃ ĐƯỢC GIAO cho bé (bài học/tiết học/khoá học của con), KHÔNG phải khi bé chỉ muốn được dạy/chơi học ngay trong lúc trò chuyện.
    • GỌI khi bé nói (tiếng Việt): "học bài thôi", "con muốn học bài", "vào bài học", "mở bài học của con", "bắt đầu bài học", "bắt đầu học bài", "mở khóa học của con", "vào khóa học của con", "chuyển sang bài học", "học tiếp bài", "tiếp tục khóa học", "mình vào học nhé".
    • GỌI khi bé nói (English): "start the lesson", "let's do the lesson", "open my lesson", "begin the class", "switch to lesson", "continue the lesson", "continue the course", "resume course".
  - KHÔNG gọi start_lesson khi bé chỉ muốn được DẠY/CHƠI HỌC NGAY trong hội thoại — đó là trò chuyện thường, bạn tự dạy luôn: "dạy con đi", "cho con học chữ", "con muốn học số", "con muốn hát", "đố con đi", "kể chuyện cho con".
  - KHÔNG gọi start_lesson cho hỏi đáp linh tinh, hỏi giờ/thời tiết, chơi game, hay bất kỳ câu trò chuyện thường nào.
  - Nếu mơ hồ (bé chỉ nói "con chán" / "chơi gì đi" / "học gì đó đi"), HỎI LẠI một câu ngắn ("Con muốn vào bài học của con, hay mình học vài từ ngay tại đây?") thay vì tự đoán mà gọi tool.
  - Sau khi gọi start_lesson xong, BẠN DỪNG dẫn dắt — phần bài học do hệ thống bài học (lesson runtime) tự điều khiển robot; bạn KHÔNG tự kể nội dung bài.

# Default system prompt template file
prompt_template: agent-base-prompt.txt

# System error response
system_error_response: "TBot is busy right now. Please try again in a moment."

# Ending prompt
end_prompt:
  enable: true # Enable ending words
  # Ending prompt
  prompt: |
    End the conversation warmly and briefly.

# Module selected for processing(The module selected for specific processing)
selected_module:
  # Voice Activity Detection (VAD) module, defaults to SileroVAD
  VAD: SileroVAD
  # Speech recognition module used only by the classic pipeline.
  ASR: OpenaiASR
  # Calls actual LLM adapter based on config name type
  LLM: ChatGLMLLM
  # Vision Language Model
  VLLM: ChatGLMVLLM
  # TTSCalls actual TTS adapter based on config name type
  TTS: EdgeTTS
  # Memory module, disabled by default. For long-term memory, mem0ai is recommended. For privacy, use local mem_local_short
  Memory: nomem
  # When intent recognition is enabled, it can play music, control volume, and recognize exit commands.
  # If intent recognition is not required, set to: nointent
  # Intent recognition can use intent_llm. Pros: highly versatile. Cons: adding a serial pre-intent recognition module increases processing latency. Supports IoT operations like volume control.
  # Intent recognition can use function_call. Cons: Requires the selected LLM to support function_call. Pros: On-demand tool calling, fast, theoretically supports all IoT commands
  # The default free ChatGLMLLM already supports function_call, but for better stability, it is recommended to set LLM to: DoubaoLLM, using the specific model_name: doubao-1-5-pro-32k-250115
  Intent: function_call

# ── Conversational lesson runtime (US-006) ───────────────────────────────────
# Enables BOTH connect-time pull AND the spoken "switch to lesson / chuyển sang
# bài học" trigger (plugins_func/functions/start_lesson.py -> core.lesson.runtime
# .maybe_start_lesson_on_connect). api_base is the live NestJS course backend /v1
# base used to fetch the device's assignment + manifest; falls back to
# server.api_url. Default stays OFF for local dev, but config_loader auto-enables
# when production lesson prerequisites are present (course backend URL +
# TBOT_DEVICE_MINT_SECRET + LESSON_ASSET_ORIGIN_BASE). Explicit
# LESSON_RUNTIME_ENABLED=false still wins.
lesson:
  runtime_enabled: false
  # Rollout controls stay dark until explicitly enabled. When allowlist is non-empty,
  # both controls apply only to listed device IDs/MACs.
  motion_presets_enabled: false
  playful_interactions_enabled: false
  renderer_v4_enabled: false
  renderer_v5_enabled: false
  rollout_device_allowlist: []
  # Lab-only raw MCP gate. Empty by default; accepts at most one live robot MAC.
  storage_hil_device_allowlist: []
  # Spoken start_lesson demo path: when true, start_lesson ignores backend assignment
  # and starts the built-in sample lesson. Interactive mode waits for child speech
  # through Google Live child-response windows.
  sample_lesson: false
  sample_mode: interactive
  # Default child quiet-window when a step omits responseTimeoutSec (sample overrides).
  child_response_timeout_sec: 12.0
  # Inbound-silence budget while a lesson runtime is RUNNING/PRELOADING. The
  # firmware pings the passive lesson channel every 2s (pong probe fails at 10s)
  # and refuses the silent SD-sync window while a lesson runs, so silence past
  # this budget means the peer is gone — close instead of leaving the runtime
  # parked in LISTENING until the 61-minute idle timeout. 0 disables.
  peer_silence_timeout_sec: 60.0
  max_no_answer_attempts: 2
  api_base: "https://tbot-backend-8wmh.onrender.com/v1"
  # device_token: ""   # optional device-scoped bearer; backend authorizes on device_id claim
  # Device-renderer profile gate: profiles this firmware can actually render. Current
  # firmware is espTft-only — a non-espTft (piTft/mobile) lesson_prepare renders BLANK
  # (lesson_handler.cc:402). The runtime start() gate skips a lesson whose profile is
  # not listed here (LESSON_VERSION_UNSUPPORTED, no frame on the wire). Add 'piTft' /
  # 'mobile' here ONLY when that firmware ships.
  supported_profiles: ['espTft']
  # Sample/demo uses SD-pack paths so firmware does not fetch HTTPS images during lesson_step.
  asset_delivery_mode: sd_pack
  asset_pack_local_root: sd://tbot/lesson-assets
  asset_pack_mount_root: /sdcard/tbot/lesson-assets
  # Delete one unattached READY pack per GC pass below 20% free or above 700 MiB.
  sd_cache_quota_bytes: 734003200
  sd_gc_free_percent: 20
  sd_preload_min_free_percent: 5
  # The ESP server writes verified bytes under the mount root; firmware reads the
  # matching sd:// localPath and refuses start until those files exist.

# Intent recognition, a module used to understand user intent, e.g., play music
Intent:
  # Disable intent recognition
  nointent:
    # No need to change type
    type: nointent
  intent_llm:
    # No need to change type
    type: intent_llm
    # Equipped with independent reasoning model for intent recognition
    # If left blank, selected_module.LLM is used by default as the reasoning model for intent recognition
    # If you do not want to use selected_module.LLM for intent recognition, it is best to use an independent LLM here, such as the free ChatGLMLLM
    llm: ChatGLMLLM
    # plugins_func/functionsmodules, can select which module to load via configuration; once loaded, conversation supports corresponding function calling
    # System loaded by default"handle_exit_intent(Exit recognition)"、"play_music(Music playback)"plugin, do not load repeatedly
    # Below is an example of loading plugins for weather query, role switching, and news query
    functions:
      - web_search
      - get_weather
      - get_news_from_newsnow
      - play_music
      - raise_left_arm
  function_call:
    # No need to change type
    type: function_call
    # plugins_func/functionsmodules, can select which module to load via configuration; once loaded, conversation supports corresponding function calling
    # System loaded by default"handle_exit_intent(Exit recognition)"、"play_music(Music playback)"plugin, do not load repeatedly
    # Below is an example of loading plugins for weather query, role switching, and news query
    functions:
      - change_role
      # Conversational "switch to lesson / chuyển sang bài học" voice trigger
      # (plugins_func/functions/start_lesson.py). Must be listed here for Gemini
      # Live / function_call to be ALLOWED to call it. Runtime still gated by
      # lesson.runtime_enabled below.
      - start_lesson
      - change_volume
      - raise_left_arm
      - web_search
      - get_weather
      # - search_from_ragflow
      # - get_news_from_chinanews
      - get_news_from_newsnow
      # play_musicBuilt-in server music playback. hass_play_music is independent external playback controlled via Home Assistant.
      # If using hass_play_music, do not enable play_music. Keep only one.
      - play_music
      #- hass_get_state
      #- hass_set_state
      #- hass_play_music

Memory:
  mem0ai:
    type: mem0ai
    # https://app.mem0.ai/dashboard/api-keys
    # 1000 free calls per month
    api_key: ${TBOT_MEMORY_MEM0AI_API_KEY:}
  powermem:
    # PowerMemOceanBase open-source agent memory component, summarizes memory via local LLM
    # Pricing: PowerMem is free; actual costs depend on the chosen LLM and database
    # - Use SQLite + free LLM(e.g., glm-4-flash) = Free
    # - Use cloud LLM or cloud database = Billed by service
    # GitHub: https://github.com/oceanbase/powermem
    # Official website: https://www.powermem.ai/
    # Usage example: https://github.com/oceanbase/powermem/tree/main/examples
    type: powermem
    # Enable user profiling
    # - false: Use normal memory mode(AsyncMemory)
    # - true: Use user profile mode(UserMemory)，Auto-extract user info
    # User profiling support: oceanbase、seekdb、sqlite (powermem 0.3.0+)
    enable_user_profile: true
    # ========== LLM Configuration ==========
    # Tongyi Qianwen: https://bailian.console.aliyun.com/?apiKey=1#/api-key
    # Zhipu AI(Free): https://bigmodel.cn/usercenter/proj-mgmt/apikeys
    llm:
      provider: openai  # Optional: qwen, openai, zhipu etc.
      config:
        api_key: ${TBOT_MEMORY_POWERMEM_LLM_CONFIG_API_KEY:}
        model: qwen-plus
        # openai_base_url: https://api.openai.com/v1  # Optional, custom service URL
    # ========== Embedding Configuration ==========
    embedder:
      provider: openai  # Optional: qwen, openai etc.
      config:
        api_key: ${TBOT_MEMORY_POWERMEM_EMBEDDER_CONFIG_API_KEY:}
        model: text-embedding-v4
        openai_base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
        # embedding_dims: 1024  # Vector dimension (configure if not 1536)

    # ========== Database Configuration ==========
    # oceanbase(Recommended,Best performance), seekdb(Recommended,AIApp-storage integration), postgres, sqlite(Lightweight alternative)
    # User profiling support: oceanbase、seekdb、sqlite
    vector_store:
      provider: sqlite
      config: {}  # SQLite No additional configuration required
      # OceanBase Config example:
      # provider: oceanbase
      # config:
      #   host: 127.0.0.1
      #   port: 2881
      #   user: root@test
      #   password: your_password
      #   db_name: powermem
      #   collection_name: memories  # Default table name; delete or rename if dimension creation fails
      #   embedding_model_dims: 1024  # Embedding vector dimension. Ensure it matches the model. e.g., Zhipu embedding-2 is 1024, embedding-3 is 2048
  nomem:
    # If you don't want to use memory, you can use nomem
    type: nomem
  mem_local_short:
    # Local memory feature. Summarized by selected_module's LLM. Data is saved locally and not uploaded to external servers.
    type: mem_local_short
    # Equipped with independent reasoning model for memory storage
    # If left blank, selected_module.LLM is used by default as the reasoning model for intent recognition
    # If you do not want to use selected_module.LLM for memory storage, it is best to use an independent LLM here for intent recognition, such as the free ChatGLMLLM
    llm: ChatGLMLLM

ASR:
  FunASR:
    type: fun_local
