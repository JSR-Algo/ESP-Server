# During development, create a 'data' directory in the project root, then inside it create a file/folder named【.config.yaml】Empty file
# Then modify any config to override【.config.yaml】file, instead of modifying【config.yaml】File
# System prioritizes reading【data/.config.yaml】File config, if【.config.yaml】If config file missing, system automatically reads【config.yaml】File configuration.
# This minimizes configuration and secures your key.
# If using the Smart Console, none of the following configurations will take effect; modify them in the Smart Console instead

# #####################################################################################
# #############################Basic server runtime config####################################
server:
  # Server listening address and port(Server listening address and port)
  ip: 0.0.0.0
  port: 8000
  # httpService port for simple OTA API(Single-service deployment)，and vision analysis interface
  http_port: 8003
  # This WebSocket config is the WebSocket URL sent to the device by the OTA interface
  # With the default configuration, the OTA interface automatically generates a WebSocket address and prints it in the startup logs. You can access this address via a browser to verify the OTA interface
  # When deploying via Docker or public network(Use SSL, domain name)may not be accurate when
  # When deploying via Docker, set the WebSocket to a LAN address
  # If using public deployment, set websocket to public address
  websocket: ws://your-ip-or-domain:port/tbot/v1/
  # Vision API URL
  # Endpoint for visual analysis sent to device
  # Using the default configuration below automatically generates a vision recognition URL, outputted in the startup logs. You can access this URL via browser to verify.
  # When deploying via Docker or public network(Use SSL, domain name)may not be accurate when
  # So if you deploy using Docker, set vision_explain to a LAN address
  # If deploying publicly, set vision_explain to the public address
  vision_explain: http://your-ip-or-domain:port/mcp/vision/explain
  # OTATimezone offset for returned information
  timezone_offset: +8
  # Authentication config
  auth:
    # Enable auth
    enabled: false
    # Whitelisted device ID list
    # Devices in whitelist bypass token verification, allowed directly
    allowed_devices:
      - "11:22:33:44:55:66"
 # MQTTGateway configuration for OTA delivery to devices. Configured via mqtt_gateway .env file, format: host:port
  mqtt_gateway: null
  # MQTTSignature key for generating MQTT connection password, configured in the .env file of mqtt_gateway
  mqtt_signature_key: null
  # UDPGateway config
  udp_gateway: null
log:
  # Set console output log format: time, log level, tag, message
  log_format: "<green>{time:YYMMDD HH:mm:ss}</green>[{version}_{selected_module}][<light-blue>{extra[tag]}</light-blue>]-<level>{level}</level>-<light-green>{message}</light-green>"
  # Set log file output format: time, log level, tag, message
  log_format_file: "{time:YYYY-MM-DD HH:mm:ss} - {version}_{selected_module} - {name} - {level} - {extra[tag]} - {message}"
  # Set log level: INFO, DEBUG
  log_level: INFO
  # Set log path
  log_dir: tmp
  # Set log file
  log_file: "server.log"
  # Set data file path
  data_dir: data

# Delete audio file after use(Delete the sound file when you are done using it)
delete_audio: true
# Disconnect duration after no voice input(Seconds)，Default 2 minutes (120 seconds)
close_connection_no_voice_time: 120
# TTSRequest timeout(Seconds)
tts_timeout: 10
# Tool call timeout(Seconds)
tool_call_timeout: 30
# Enable wake word acceleration
enable_wakeup_words_response_cache: true
# Whether to reply with the wake word at the start
enable_greeting: true
# Whether to enable notification tone after speaking
enable_stop_tts_notify: false
# Enable prompt tone after speaking, sound effect URL
stop_tts_notify_voice: "config/assets/tts_notify.mp3"
# Whether to enable WebSocket heartbeat keep-alive mechanism
enable_websocket_ping: false


# TTSAudio send delay config
# tts_audio_send_delay: Control audio packet transmission interval
#   0: Use precise time control, strictly matching audio frame rate (default, calculated by audio frame rate at runtime)
#   > 0: Send using fixed delay (ms), e.g.,: 60
tts_audio_send_delay: 0

exit_commands:
  - "exit"
  - "quit"
  - "stop"

tbot:
  type: hello
  version: 1
  transport: websocket
  audio_params:
    format: opus
    # OpusSupported sample rate range is[8000, 12000, 16000, 24000, 48000]
    sample_rate: 24000
    channels: 1
    frame_duration: 60

voice_mode:
  type: google_live
  fallback_to_classic_on_error: true

google_live:
  api_key: ${GOOGLE_API_KEY}
  model: gemini-2.5-flash-native-audio-preview-12-2025
  enable_audio_input: true
  enable_audio_output: true
  native_voice: true
  language_code: vi-VN
  input_audio_format: pcm16
  input_sample_rate: 16000
  output_audio_format: pcm16
  output_sample_rate: 24000
  # Runtime sẽ force disable_server_side_interruptions=true để tránh loa
  # robot bị mic thu lại làm Google Live tự ngắt nhầm. Ngắt ngang đi qua
  # wake-word hoặc transcript/tool intent, không qua raw audio VAD.
  disable_server_side_interruptions: false
  turn_coverage: TURN_INCLUDES_ALL_INPUT
  # Giảm độ nhạy VAD để echo loa không kích hoạt ngắt nhầm.
  start_of_speech_sensitivity: START_SENSITIVITY_LOW
  end_of_speech_sensitivity: END_SENSITIVITY_LOW
  prefix_padding_ms: 300
  silence_duration_ms: 1200
  log_audio_diagnostics: true
  connect_timeout_sec: 10
  recv_timeout_sec: 60
  input_flush_delay_sec: 0.8
  # Hard-cap fallback if speech-aware finalisation never satisfies its
  # invariants (e.g. mic stays loud forever). Lower = faster stop, but
  # risk of clipping the trailing syllable; higher = safer transcript
  # but slower model turn-around. 0.8s matches input_flush_delay_sec.
  interrupt_forced_flush_delay_sec: 0.8
  # Speech-aware interrupt-turn finalisation thresholds. The controller
  # waits until BOTH (elapsed >= min_capture) AND (silence_since_last_speech
  # >= speech_tail) before ending the audio stream — or until max_capture
  # is reached. Trade-off:
  #   - LOWER min/tail = faster reply but higher false-positive interrupts
  #     from echo-only frames clipped before user actually spoke.
  #   - HIGHER min/tail = fewer false positives but slower stop latency.
  #   - max_capture protects against deadlock when mic never quiets down.
  interrupt_min_capture_ms: 360
  interrupt_speech_tail_ms: 240
  interrupt_max_capture_ms: 1200
  reconnect_buffer_ms: 2000
  # ENABLED: with firmware CONFIG_USE_DEVICE_AEC=y, device strips most echo
  # before sending mic to server, so RMS-local barge-in becomes safe.
  # Without this flag, user cannot interrupt mid-response via voice (only
  # via wake-word, which is masked by echo during Speaking).
  barge_in: true
  interrupt_on_input_while_speaking: true
  # Transcript barge-in vẫn bật làm fallback khi VAD bỏ lỡ.
  barge_in_via_transcript: true
  barge_in_transcript_min_chars: 4
  drop_input_while_speaking: false
  interrupt_min_output_age_sec: 0.25
  interrupt_suppress_audio_sec: 0.25
  suppress_robot_output_echo: true
  wake_audio_allow_window_sec: 5.0
  # Cho phép user nói đủ lớn/ngắt thật sự lọt qua echo gate khi firmware
  # không gửi wake event trong lúc robot đang nói. Echo loa thường thấp hơn.
  robot_output_echo_bypass_rms_threshold: 650
  robot_output_echo_bypass_min_duration_sec: 0.06
  # ENABLED: with device-AEC the post-AEC echo level is much lower than
  # raw 700 RMS, so the bypass interrupt path is no longer false-positive.
  echo_bypass_interrupt_enabled: true
  hard_reconnect_on_interrupt: false
  interrupt_debounce_sec: 0.2
  model_output_unblock_timeout_sec: 1.5
  # AEC: khử echo trước khi gửi lên Live, giảm false-trigger VAD/STT.
  aec_enabled: true
  aec_filter_length_ms: 200
  aec_frame_ms: 10
  # Giữ lại các ngưỡng RMS cũ (không dùng khi barge_in=false) để dễ rollback.
  interrupt_rms_threshold: 5000
  interrupt_min_input_duration_sec: 0.42
  # PR4 P4.5: lowered 5000→4500 per baseline max echo RMS 8310 (with margin).
  barge_in_rms_threshold: 4500
  barge_in_min_input_duration_sec: 0.30
  barge_in_min_output_age_sec: 0.25
  # PR4 P4.5: explicit flag preserving plan §5 decision — RMS-VAD is the
  # single trigger; server-side Live VAD remains gated by
  # disable_server_side_interruptions. Flip only after AC2/AC4 fail.
  server_side_vad_enabled: false
  send_transcript_events: true
  send_llm_state_events: false
  reconnect:
    enabled: true
    max_retries: 6
    backoff_ms: 250
    backoff_multiplier: 2

# ── Conversational lesson runtime (US-006) ───────────────────────────────────
# DARK by default: connection.py:_lesson_runtime_enabled() reads
# lesson.runtime_enabled (default False), and the start_lesson voice trigger
# honors the same gate. Flip runtime_enabled to true to allow:
#   - connect-time pull (maybe_start_lesson_on_connect), and
#   - the spoken "switch to lesson / chuyển sang bài học" trigger
#     (plugins_func/functions/start_lesson.py).
#
# api_base is the live NestJS course backend /v1 base used to fetch the device's
# current assignment + manifest. The runtime reads lesson.api_base FIRST and
# falls back to server.api_url. Both can be supplied by env instead of editing
# this file (additive, defaults unchanged when env unset):
#   LESSON_RUNTIME_ENABLED=true   -> lesson.runtime_enabled  (boolean parsed)
#   COURSE_BACKEND_URL=<.../v1>    -> server.api_url AND, as a fallback,
#                                    lesson.api_base (only if api_base unset)
# See config/config_loader.py apply_env_overrides().
lesson:
  # Master gate. Leave false in any deploy that should stay voice-only.
  runtime_enabled: false
  # NestJS course backend base, e.g. https://<host>/v1 . Leave empty to inherit
  # server.api_url (set from COURSE_BACKEND_URL). If both are empty the lesson
  # pull short-circuits (logged "skipped: no api_base or device_id").
  api_base: ""
  # Optional device-scoped bearer token for /v1/devices/:id/... calls. Optional
  # today (D-RUNTOKEN); backend authorizes on the device_id claim.
  # device_token: ""

# Module test config
module_test:
  test_sentences:
    - "Hello, please introduce yourself."
    - "What's the weather like today?"
    - "Summarize the basic principles and applications of quantum computing in about 100 words."

# Wake word used to distinguish wake word from speech content
wakeup_words:
  - "hello tbot"
  - "hey tbot"
  - "hello robot"
  - "hey assistant"
# MCPEndpoint address (format: ws)://Your MCP endpoint IP or domain:Port/mcp/?token=Your token
# Detailed tutorial https://github.com/xinnan-tech/tbot-esp32-server/blob/main/docs/mcp-endpoint-integration.md
mcp_endpoint: your-mcp-endpoint-websocket-url

# Context source config
# Used to inject dynamic data into system prompts, e.g., health data, stock info, etc.
# Multiple context sources can be added
context_providers:
  - url: ""
    headers:
      Authorization: ""

# Basic plugin config
plugins:
  # Get weather plugin config, enter your api_key here
  # Shared project key; heavy usage may lead to rate limiting
  # For better stability, apply for your own key; includes 1000 free calls daily
  # Application URL: https://console.qweather.com/#/apps/create-key/over
  # After applying, find your apihost via this link: https://console.qweather.com/setting?lang=zh
  get_weather:
    api_host: "mj7p3y7naa.re.qweatherapi.com"
    # SECURITY: previously-committed key was exposed in git and MUST be ROTATED.
    # Set via env QWEATHER_API_KEY (or override in data/.config.yaml); do not commit a literal key.
    api_key: ${QWEATHER_API_KEY:}
    default_location: "Ho Chi Minh City"
  # Get news plugin configuration. Pass URL for required news type. Default supports social, tech, and financial news.
  # More news list types: https://www.chinanews.com.cn/rss/
  get_news_from_chinanews:
    default_rss_url: "https://www.chinanews.com.cn/rss/society.xml"
    society_rss_url: "https://www.chinanews.com.cn/rss/society.xml"
    world_rss_url: "https://www.chinanews.com.cn/rss/world.xml"
    finance_rss_url: "https://www.chinanews.com.cn/rss/finance.xml"
  get_news_from_newsnow:
    url: "https://newsnow.busiyi.world/api/s?id="
    news_sources: "BBC;Reuters;TechCrunch"
  home_assistant:
    devices:
      - Living room,Toy light,switch.cuco_cn_460494544_cp1_on_p_2_1
      - Bedroom,Desk lamp,switch.iot_cn_831898993_socn1_on_p_2_1
    base_url: http://homeassistant.local:8123
    api_key: your-home-assistant-api-token
  play_music:
    music_dir: "./music"  # Music file storage path, will search for music files in this directory and subdirectories
    music_ext: # Music file type, mp3 format is most efficient
      - ".mp3"
      - ".wav"
      - ".p3"
    refresh_time: 300 # Interval to refresh music list, in seconds
  search_from_ragflow:
    # Knowledge base description, helps LLM know when to call it
    description: "Call this method when the user asks about your knowledge base, then answer using retrieved knowledge."
    # ragflowAPI config
    base_url: "http://192.168.0.8"
    # ragflow apiAccess token
    api_key: "ragflow-xxx"
    # ragflowKnowledge base ID
    dataset_ids: ["123456789"]
# Voiceprint recognition config
voiceprint:
  # Voiceprint API URL
  url: 
  # Speaker config: speaker_id,Name,Description
  speakers:
    - "test1,Alex,Alex is a developer"
    - "test2,Sam,Sam is a product manager"
    - "test3,Taylor,Taylor is a designer"
  # Voiceprint recognition similarity threshold, range 0.0-1.0, default 0.4
  # Higher values are stricter, reducing false acceptance but potentially increasing false rejection
  similarity_threshold: 0.4

# #####################################################################################
# ################################Below is the character model configuration######################################

prompt: |
  You are TBot, a concise, friendly AI assistant for a voice robot.
  [Core traits]
  - Keep responses practical and easy to understand.
  - Ask a short clarification when the user's request is ambiguous.
  - For technical topics, explain the key idea first, then provide steps only when useful.
  [Interaction guide]
  - Match the user's language when possible.
  - Avoid long monologues unless the user asks for depth.
  - Never pretend to have access to private data or real-world actions you cannot perform.

# Default system prompt template file
prompt_template: agent-base-prompt.txt

# System error response
system_error_response: "TBot is busy right now. Please try again in a moment."

# Ending prompt
end_prompt:
  enable: true # Enable ending words
  # Ending prompt
  prompt: |
    End the conversation warmly and briefly.

# Module selected for processing(The module selected for specific processing)
selected_module:
  # Voice Activity Detection (VAD) module, defaults to SileroVAD
  VAD: SileroVAD
  # Speech recognition module used only by the classic pipeline.
  ASR: OpenaiASR
  # Calls actual LLM adapter based on config name type
  LLM: ChatGLMLLM
  # Vision Language Model
  VLLM: ChatGLMVLLM
  # TTSCalls actual TTS adapter based on config name type
  TTS: EdgeTTS
  # Memory module, disabled by default. For long-term memory, mem0ai is recommended. For privacy, use local mem_local_short
  Memory: nomem
  # When intent recognition is enabled, it can play music, control volume, and recognize exit commands.
  # If intent recognition is not required, set to: nointent
  # Intent recognition can use intent_llm. Pros: highly versatile. Cons: adding a serial pre-intent recognition module increases processing latency. Supports IoT operations like volume control.
  # Intent recognition can use function_call. Cons: Requires the selected LLM to support function_call. Pros: On-demand tool calling, fast, theoretically supports all IoT commands
  # The default free ChatGLMLLM already supports function_call, but for better stability, it is recommended to set LLM to: DoubaoLLM, using the specific model_name: doubao-1-5-pro-32k-250115
  Intent: function_call

# Intent recognition, a module used to understand user intent, e.g., play music
Intent:
  # Disable intent recognition
  nointent:
    # No need to change type
    type: nointent
  intent_llm:
    # No need to change type
    type: intent_llm
    # Equipped with independent reasoning model for intent recognition
    # If left blank, selected_module.LLM is used by default as the reasoning model for intent recognition
    # If you do not want to use selected_module.LLM for intent recognition, it is best to use an independent LLM here, such as the free ChatGLMLLM
    llm: ChatGLMLLM
    # plugins_func/functionsmodules, can select which module to load via configuration; once loaded, conversation supports corresponding function calling
    # System loaded by default"handle_exit_intent(Exit recognition)"、"play_music(Music playback)"plugin, do not load repeatedly
    # Below is an example of loading plugins for weather query, role switching, and news query
    functions:
      - get_weather
      - get_news_from_newsnow
      - play_music
      - raise_left_arm
      - raise_right_arm
      - lower_left_arm
      - lower_right_arm
      - raise_both_arms
      - lower_both_arms
      - set_left_arm_percent
      - set_right_arm_percent
      - set_both_arms_percent
      - turn_head_left
      - turn_head_right
      - center_head
      - set_head_angle
      - set_head_percent
      - turn_head_left_then_right_max
  function_call:
    # No need to change type
    type: function_call
    # plugins_func/functionsmodules, can select which module to load via configuration; once loaded, conversation supports corresponding function calling
    # System loaded by default"handle_exit_intent(Exit recognition)"、"play_music(Music playback)"plugin, do not load repeatedly
    # Below is an example of loading plugins for weather query, role switching, and news query
    functions:
      - change_role
      # Conversational "switch to lesson" trigger (plugins_func/functions/start_lesson.py).
      # Must be listed here for the LLM/Gemini Live to be allowed to call it.
      # The runtime still only starts when lesson.runtime_enabled is true.
      - start_lesson
      - change_volume
      - raise_left_arm
      - raise_right_arm
      - lower_left_arm
      - lower_right_arm
      - raise_both_arms
      - lower_both_arms
      - set_left_arm_percent
      - set_right_arm_percent
      - set_both_arms_percent
      - turn_head_left
      - turn_head_right
      - center_head
      - set_head_angle
      - set_head_percent
      - turn_head_left_then_right_max
      - get_weather
      # - search_from_ragflow
      # - get_news_from_chinanews
      - get_news_from_newsnow
      # play_musicBuilt-in server music playback. hass_play_music is independent external playback controlled via Home Assistant.
      # If using hass_play_music, do not enable play_music. Keep only one.
      - play_music
      #- hass_get_state
      #- hass_set_state
      #- hass_play_music

Memory:
  mem0ai:
    type: mem0ai
    # https://app.mem0.ai/dashboard/api-keys
    # 1000 free calls per month
    api_key: Your mem0ai API key
  powermem:
    # PowerMemOceanBase open-source agent memory component, summarizes memory via local LLM
    # Pricing: PowerMem is free; actual costs depend on the chosen LLM and database
    # - Use SQLite + free LLM(e.g., glm-4-flash) = Free
    # - Use cloud LLM or cloud database = Billed by service
    # GitHub: https://github.com/oceanbase/powermem
    # Official website: https://www.powermem.ai/
    # Usage example: https://github.com/oceanbase/powermem/tree/main/examples
    type: powermem
    # Enable user profiling
    # - false: Use normal memory mode(AsyncMemory)
    # - true: Use user profile mode(UserMemory)，Auto-extract user info
    # User profiling support: oceanbase、seekdb、sqlite (powermem 0.3.0+)
    enable_user_profile: true
    # ========== LLM Configuration ==========
    # Tongyi Qianwen: https://bailian.console.aliyun.com/?apiKey=1#/api-key
    # Zhipu AI(Free): https://bigmodel.cn/usercenter/proj-mgmt/apikeys
    llm:
      provider: openai  # Optional: qwen, openai, zhipu etc.
      config:
        api_key: Your LLM API key
        model: qwen-plus
        # openai_base_url: https://api.openai.com/v1  # Optional, custom service URL
    # ========== Embedding Configuration ==========
    embedder:
      provider: openai  # Optional: qwen, openai etc.
      config:
        api_key: Your embedding model API key
        model: text-embedding-v4
        openai_base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
        # embedding_dims: 1024  # Vector dimension (configure if not 1536)

    # ========== Database Configuration ==========
    # oceanbase(Recommended,Best performance), seekdb(Recommended,AIApp-storage integration), postgres, sqlite(Lightweight alternative)
    # User profiling support: oceanbase、seekdb、sqlite
    vector_store:
      provider: sqlite
      config: {}  # SQLite No additional configuration required
      # OceanBase Config example:
      # provider: oceanbase
      # config:
      #   host: 127.0.0.1
      #   port: 2881
      #   user: root@test
      #   password: your_password
      #   db_name: powermem
      #   collection_name: memories  # Default table name; delete or rename if dimension creation fails
      #   embedding_model_dims: 1024  # Embedding vector dimension. Ensure it matches the model. e.g., Zhipu embedding-2 is 1024, embedding-3 is 2048
  nomem:
    # If you don't want to use memory, you can use nomem
    type: nomem
  mem_local_short:
    # Local memory feature. Summarized by selected_module's LLM. Data is saved locally and not uploaded to external servers.
    type: mem_local_short
    # Equipped with independent reasoning model for memory storage
    # If left blank, selected_module.LLM is used by default as the reasoning model for intent recognition
    # If you do not want to use selected_module.LLM for memory storage, it is best to use an independent LLM here for intent recognition, such as the free ChatGLMLLM
    llm: ChatGLMLLM

ASR:
  FunASR:
    type: fun_local
    model_dir: models/SenseVoiceSmall
    output_dir: tmp/
  FunASRServer:
    # Deploy FunASR independently, use FunASR API service with only five lines of code
    # First command: mkdir -p ./funasr-runtime-resources/models
    # Second command: sudo docker run -p 10096:10095 -it --privileged=true -v $PWD/funasr-runtime-resources/models:/workspace/models registry.cn-hangzhou.aliyuncs.com/funasr_repo/funasr:funasr-runtime-sdk-online-cpu-0.1.12
    # After executing the previous command, you will enter the container; continue with the third command: cd FunASR/runtime
    # Do not exit the container. Continue executing the fourth command in the container: nohup bash run_server_2pass.sh --download-model-dir /workspace/models --vad-dir damo/speech_fsmn_vad_zh-cn-16k-common-onnx --model-dir iic/SenseVoiceSmall-onnx  --online-model-dir damo/speech_paraformer-large_asr_nat-zh-cn-16k-common-vocab8404-online-onnx  --punc-dir damo/punc_ct-transformer_zh-cn-common-vad_realtime-vocab272727-onnx --lm-dir damo/speech_ngram_lm_zh-cn-ai-wesp-fst --itn-dir thuduj12/fst_itn_zh --hotword /workspace/models/hotwords.txt > log.txt 2>&1 &
    # After running the previous command, you will enter the container. Continue with the 5th command: tail -f log.txt
    # Model download logs appear after 5th sentence execution; ready to connect post-download
    # Above is CPU inference. For GPU, refer to: https://github.com/modelscope/FunASR/blob/main/runtime/docs/SDK_advanced_guide_online_zh.md
    type: fun_server
    host: 127.0.0.1
    port: 10096
    is_ssl: true
    api_key: none
    output_dir: tmp/
  SherpaASR:
    # Sherpa-ONNX Local speech recognition (requires manual model download)
    type: sherpa_onnx_local
    model_dir: models/sherpa-onnx-sense-voice-zh-en-ja-ko-yue-2024-07-17
    output_dir: tmp/
    # Model type: sense_voice (Multilingual) or paraformer (English only)
    model_type: sense_voice
  SherpaParaformerASR:
    # English speech recognition model, can run on low-performance devices (requires manual model download, e.g., RK3566-2g)
    # For detailed configuration, refer to: docs/sherpa-paraformer-guide.md
    type: sherpa_onnx_local
    model_dir: models/sherpa-onnx-paraformer-zh-small-2024-03-09
    output_dir: tmp/
    model_type: paraformer
  DoubaoASR:
    # Apply for keys and related info here
    # https://console.volcengine.com/speech/app
    # DoubaoASRDifference from DoubaoStreamASR: DoubaoASR is billed per request; DoubaoStreamASR is billed by duration.
    # Generally, pay-per-request is cheaper, but DoubaoStreamASR uses LLM technology for better results
    type: doubao
    appid: Your Volcengine TTS appid
    access_token: Your Volcengine TTS access_token
    cluster: volcengine_input_common
    # Hotword/replacement usage workflow: https://www.volcengine.com/docs/6561/155738
    boosting_table_name: （(Optional) Your hotword file name
    correct_table_name: （(Optional) Your replacement words filename
