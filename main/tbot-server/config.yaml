  AliyunBLStreamASR:
    # Alibaba Bailian Paraformer Real-time ASR Service
    # WebSocketReal-time streaming ASR, supporting multilingual, custom hotwords, semantic punctuation, and other advanced features
    # Platform URL: https://bailian.console.aliyun.com/
    # API KeyURL: https://bailian.console.aliyun.com/#/api-key
    # Documentation URL: https://help.aliyun.com/zh/model-studio/websocket-for-paraformer-real-time-service
    # Supported model: paraformer-realtime-v2(Recommended), paraformer-realtime-8k-v2, paraformer-realtime-v1, paraformer-realtime-8k-v1
    type: aliyunbl_stream
    # Required parameter
    api_key: ${TBOT_ASR_ALIYUNBLSTREAMASR_API_KEY:}
    # Model selection, v2 recommended
    model: paraformer-realtime-v2
    # Audio format & sample rate
    format: pcm
    sample_rate: 16000  # v2Supports any sample rate (v1: 16000 only, 8k version: 8000 only)
    # Optional parameter
    disfluency_removal_enabled: false  # Filter filler words(e.g."uh"、"ah"etc.)
    semantic_punctuation_enabled: false  # Semantic segmentation(true:Meeting scenario,Accurate;false:VADSentence segmentation,Interaction scenario,Low latency)
    max_sentence_silence: 200  # VADSentence split silence threshold(ms)，Range 200-6000, only effective during VAD segmentation
    multi_threshold_mode_enabled: false  # Prevents VAD sentences from being cut too long. Only effective during VAD segmentation
    punctuation_prediction_enabled: true  # Whether to automatically add punctuation
    inverse_text_normalization_enabled: true  # Enable ITN(Convert English numerals to Arabic numerals)
    # Custom vocabulary doc URL: https://help.aliyun.com/zh/model-studio/custom-hot-words?
    # vocabulary_id: vocab-xxx-24ee19fa8cfb4d52902170a0xxxxxxxx  # Hotword ID(Optional)
    # language_hints: ["zh", "en"]  # Specify language(Optional)，Supports zh, en, ja, yue, ko, de, fr, ru
    output_dir: tmp/  
