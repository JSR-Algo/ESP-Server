# Docker安装Server

version: '3'
services:
  tbot-esp32-server:
    image: local/tbot-server:${TBOT_SERVER_IMAGE_TAG:-latest}
    container_name: tbot-esp32-server
    restart: always
    security_opt:
      - seccomp:unconfined
    environment:
      - TZ=Asia/Shanghai
      - LESSON_RUNTIME_ENABLED=${LESSON_RUNTIME_ENABLED:-false}
      - COURSE_BACKEND_URL=${COURSE_BACKEND_URL:-}
      - LESSON_ASSET_ORIGIN_BASE=${LESSON_ASSET_ORIGIN_BASE:-}
      - TBOT_DEVICE_MINT_SECRET=${TBOT_DEVICE_MINT_SECRET:-}
      # Public base robots use to download lesson packs (must match real cache bytes).
      - LESSON_ASSET_PUBLIC_BASE_URL=${LESSON_ASSET_PUBLIC_BASE_URL:-}
      - LESSON_ASSET_DELIVERY_MODE=${LESSON_ASSET_DELIVERY_MODE:-}
      - LESSON_SD_FANOUT_CONCURRENCY=${LESSON_SD_FANOUT_CONCURRENCY:-4}
      # Built-in interactive "say the word" speaking lesson (start_lesson loads it with
      # no backend assignment). Defaults match config.yaml so Docker does not silently
      # disable the spoken sample flow.
      - LESSON_SAMPLE_ENABLED=${LESSON_SAMPLE_ENABLED:-true}
      - LESSON_SAMPLE_MODE=${LESSON_SAMPLE_MODE:-interactive}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
      - TBOT_GOOGLE_LIVE_API_KEY=${TBOT_GOOGLE_LIVE_API_KEY:-}
      - TBOT_GOOGLE_LIVE_ENABLED=${TBOT_GOOGLE_LIVE_ENABLED:-true}
      - TBOT_GOOGLE_LIVE_MODEL=${TBOT_GOOGLE_LIVE_MODEL:-gemini-3.1-flash-live-preview}
      - TBOT_GOOGLE_LIVE_VOICE_NAME=${TBOT_GOOGLE_LIVE_VOICE_NAME:-Kore}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GOOGLE_GEMINI_API_KEY=${GOOGLE_GEMINI_API_KEY:-}
    ports:
      # ws服务端
      - "8000:8000"
      # http服务的端口，用于简单OTA接口(单服务部署)，以及视觉分析接口
      - "8003:8003"
    volumes:
      # 配置文件目录
      - ./data:/opt/tbot-esp32-server/data
      # NOTE: SenseVoice model.pt mount removed — file was lost from host and
      # voice_mode=google_live uses Gemini ASR (not SenseVoice). To restore
      # classic_pipeline ASR support, replace placeholder with full ~250MB
      # model file then re-add this mount line.
      # - ./models/SenseVoiceSmall/model.pt:/opt/tbot-esp32-server/models/SenseVoiceSmall/model.pt
