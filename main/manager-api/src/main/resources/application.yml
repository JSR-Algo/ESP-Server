# Tomcat
server:
  tomcat:
    uri-encoding: UTF-8
    threads:
      max: 1000
      min-spare: 30
  port: 8002
  servlet:
    context-path: /tbot
    session:
      cookie:
        http-only: true

spring:
  # 环境 dev|test|prod
  # profiles:
  #   active: dev
  messages:
    encoding: UTF-8
    basename: i18n/messages
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB
      enabled: true
  main:
    allow-bean-definition-overriding: true

knife4j:
  enable: false
  basic:
    enable: false
    # SECURITY FIX: Hardcoded password removed. Use env var or disable in production.
    username: ${KNIFE4J_USERNAME:admin}
    password: ${KNIFE4J_PASSWORD:}
  setting:
    enableFooter: false

renren:
  redis:
    open: true
  xss:
    enabled: true
    exclude-urls:

#mybatis
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  #实体扫描，多个package用逗号或者分号分隔
  typeAliasesPackage: tbot.modules.*.entity
  global-config:
    #数据库相关配置
    db-config:
      #主键类型
      id-type: ASSIGN_ID
    banner: false
  #原生配置
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
    call-setters-on-nulls: true
    jdbc-type-for-null: 'null'
  configuration-properties:
    prefix:
    blobType: BLOB
    boolValue: TRUE

management:
  endpoints:
    web:
      exposure:
        # SECURITY FIX: Only expose health (for container probes). info/metrics removed.
        include: health
      base-path: /actuator
  endpoint:
    health:
      probes:
        enabled: true
      # SECURITY FIX: Never show health details (no Spring Security integration,
      # so 'when_authorized' would not work correctly with Shiro anyway).
      show-details: never
  info:
    env:
      # SECURITY FIX: Disable env info exposure to prevent secret leakage.
      enabled: false