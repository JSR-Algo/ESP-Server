name: Docker Image CI

on:
  push:
    tags:
      - 'v*.*.*'  # 只在以 v 开头的标签推送时触发，例如 v1.0.0
  workflow_dispatch:
    inputs:
      nest_auth_disabled:
        description: Build manager-web with server-proxy NestJS auth instead of per-user author login
        required: false
        type: boolean
        default: true
  workflow_run:
    workflows: ["Build Base Image"]
    types:
      - completed

jobs:
  release:
    name: Release Docker images
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: write
      id-token: write
      issues: write
    steps:
      - name: Check Disk Space
        run: |
          df -h
          docker system df

      - name: Clean up Docker resources
        run: |
          docker system prune -af
          docker builder prune -af

      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Normalize image repository
        run: |
          echo "IMAGE_REPOSITORY=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
          echo "RELEASE_SHA=${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver-opts: |
            network=host

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version from tag
        id: get_version
        run: |
          if [[ "$GITHUB_REF" =~ ^refs/tags/v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "VERSION=${BASH_REMATCH[1]}" >> $GITHUB_ENV
            echo "IS_VERSION=true" >> $GITHUB_ENV
          else
            echo "VERSION=latest" >> $GITHUB_ENV
            echo "IS_VERSION=false" >> $GITHUB_ENV
          fi

      # 构建 tbot-server 镜像
      - name: Build and push tbot-server
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile-server
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_REPOSITORY }}:server_${{ env.RELEASE_SHA }}
            ${{ env.IS_VERSION == 'true' && format('ghcr.io/{0}:server_{1},ghcr.io/{0}:server_latest', env.IMAGE_REPOSITORY, env.VERSION) || format('ghcr.io/{0}:server_latest', env.IMAGE_REPOSITORY) }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILDKIT_PROGRESS=plain
            TBOT_SERVER_BASE_IMAGE=ghcr.io/${{ env.IMAGE_REPOSITORY }}:server-base

      # 构建 manager-api 镜像
      - name: Build and push manager-web
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile-web
          push: true
          tags: |
            ${{ env.IS_VERSION == 'true' && format('ghcr.io/{0}:web_{1},ghcr.io/{0}:web_latest', env.IMAGE_REPOSITORY, env.VERSION) || format('ghcr.io/{0}:web_latest', env.IMAGE_REPOSITORY) }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILDKIT_PROGRESS=plain
            VUE_APP_NEST_AUTH_DISABLED=${{ github.event_name != 'workflow_dispatch' || inputs.nest_auth_disabled }}
