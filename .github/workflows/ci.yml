name: CI Quality Gates

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  java-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - run: cd main/manager-api && mvn test
      - uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: main/manager-api/target/site/jacoco/

  python-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: |
          cd main/tbot-server
          pip install -r requirements.txt
          pytest --cov --cov-report=xml
      - uses: actions/upload-artifact@v4
        with:
          name: python-coverage
          path: main/tbot-server/coverage.xml

  frontend-lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        project: [manager-web, manager-mobile]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      - run: |
          cd main/${{ matrix.project }}
          npm ci || npm install
          npm run lint || echo "Lint not configured yet"
          npm audit --audit-level=high || echo "Audit issues found"

  python-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: |
          cd main/tbot-server
          pip install ruff mypy
          ruff check . || echo "Ruff issues found"
          mypy . || echo "MyPy issues found"

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: |
          cd main/manager-api
          mvn org.owasp:dependency-check-maven:check -f pom.xml || echo "Dependency check completed with issues"
      - run: |
          pip install pip-audit
          pip-audit -r main/tbot-server/requirements.txt || echo "pip-audit completed"

  docker-build:
    runs-on: ubuntu-latest
    needs: [java-test, python-test]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: docker build -f Dockerfile-server-base -t tbot-server-base:test .
      - run: docker build -f Dockerfile-server --build-arg TBOT_SERVER_BASE_IMAGE=tbot-server-base:test -t tbot-server:test .

  security-scan:
    runs-on: ubuntu-latest
    needs: [docker-build]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: docker build -f Dockerfile-server-base -t tbot-server-base:test .
      - run: docker build -f Dockerfile-server --build-arg TBOT_SERVER_BASE_IMAGE=tbot-server-base:test -t tbot-server:scan .
      - uses: aquasecurity/trivy-action@master
        with:
          image-ref: tbot-server:scan
          format: 'sarif'
          output: 'trivy-results.sarif'
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'
