name: CI Quality Gates

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  java-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
      - run: cd main/manager-api && mvn test
      - uses: actions/upload-artifact@v7
        if: hashFiles('main/manager-api/target/site/jacoco/**') != ''
        with:
          name: jacoco-report
          path: main/manager-api/target/site/jacoco/

  python-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - run: python main/tbot-server/scripts/check_python_runtime.py
      - run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends libopus0 libspeexdsp-dev swig build-essential pkg-config
          cd main/tbot-server
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov
          # BLOCKING, never advisory (T5.1): the vendored golden vectors must
          # hash to the frozen sha256 that tbot-backend asserts against the SAME
          # constant, so a one-sided edit is RED in both pipelines. Run first so
          # a contract divergence is not buried in the full-suite output.
          python -m pytest -q tests/test_lesson_contract_vectors_parity.py
          python -m pytest --cov --cov-report=xml
      - uses: actions/upload-artifact@v7
        with:
          name: python-coverage
          path: main/tbot-server/coverage.xml

  frontend-lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        project: [manager-web, manager-mobile]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '18'
      - run: |
          cd main/${{ matrix.project }}
          npm ci || npm install --legacy-peer-deps || echo "Install failed"
          npm run lint || echo "Lint not configured yet"
          npm audit --audit-level=high || echo "Audit issues found"

  python-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - run: python main/tbot-server/scripts/check_python_runtime.py
      - run: |
          cd main/tbot-server
          pip install ruff mypy
          ruff check . || echo "Ruff issues found"
          mypy . || echo "MyPy issues found"

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - run: python main/tbot-server/scripts/check_python_runtime.py
      - run: |
          cd main/manager-api
          mvn org.owasp:dependency-check-maven:check -f pom.xml || echo "Dependency check completed with issues"
      - run: |
          pip install pip-audit
          pip-audit -r main/tbot-server/requirements.txt || echo "pip-audit completed"

  docker-build:
    runs-on: ubuntu-latest
    needs: [java-test, python-test]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - run: docker build -f Dockerfile-server-base -t tbot-server-base:test .
      - run: docker build -f Dockerfile-server --build-arg TBOT_SERVER_BASE_IMAGE=tbot-server-base:test -t tbot-server:test .

  security-scan:
    runs-on: ubuntu-latest
    needs: [docker-build]
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - run: docker build -f Dockerfile-server-base -t tbot-server-base:test .
      - run: docker build -f Dockerfile-server --build-arg TBOT_SERVER_BASE_IMAGE=tbot-server-base:test -t tbot-server:scan .
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: tbot-server:scan
          format: 'sarif'
          output: 'trivy-results.sarif'
      - uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'
