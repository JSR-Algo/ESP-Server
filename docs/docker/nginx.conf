user  root;
worker_processes  4;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  300;
    client_header_timeout 180s;
    client_body_timeout 180s;
    client_max_body_size 1024M;

    gzip on;
    gzip_buffers 32 4K;
    gzip_comp_level 6;
    gzip_min_length 100;
    gzip_types application/javascript text/css text/xml image/jpeg image/gif image/png;
    gzip_disable "MSIE [1-6]\.";
    gzip_vary on;

    server {
        # 无域名访问，就用localhost
        server_name localhost;
        # 80端口
        listen  8002;

        # 转发到编译后到web目录
        location / {
			root /usr/share/nginx/html;
			try_files $uri $uri/ /index.html;
		}

        # 转发到manager-api
        location /tbot/ {
            proxy_pass http://127.0.0.1:8003;
            proxy_set_header   Host   $host;
            proxy_cookie_path /manager/ /;
            proxy_set_header   Referer $http_referer;
            proxy_set_header   Cookie $http_cookie;

            proxy_connect_timeout 15;
            proxy_send_timeout 15;
            proxy_read_timeout 15;

            proxy_set_header   X-Real-IP  $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Some firmware builds use /ota/ directly instead of /tbot/ota/.
        location /ota/ {
            proxy_pass http://127.0.0.1:8003/tbot/ota/;
            proxy_set_header   Host   $host;
            proxy_set_header   X-Real-IP  $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Course CMS (migrated into manager-web) -> the canonical NestJS authoring
        # API. Same-origin from the SPA, so the browser needs no CORS. Per-user
        # auth: the client sends its NestJS session token on X-Nest-Authorization
        # (the flyio client forces Authorization to the manager-api token), which
        # we promote to Authorization here. Empty when not yet signed in -> NestJS
        # 401 -> the UI prompts the NestJS login dialog.
        location /nestjs/ {
            resolver 8.8.8.8 1.1.1.1 valid=300s ipv6=off;
            set $nestjs_host tbot-backend-8wmh.onrender.com;
            rewrite ^/nestjs/(.*)$ /$1 break;
            proxy_pass https://$nestjs_host;
            proxy_ssl_server_name on;
            proxy_set_header Host $nestjs_host;
            proxy_set_header Authorization $http_x_nest_authorization;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_connect_timeout 30;
            proxy_send_timeout 60;
            proxy_read_timeout 60;
        }
    }
}
