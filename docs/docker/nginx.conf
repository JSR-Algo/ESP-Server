user  root;
worker_processes  4;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  300;
    client_header_timeout 180s;
    client_body_timeout 180s;
    client_max_body_size 1024M;

    gzip on;
    gzip_buffers 32 4K;
    gzip_comp_level 6;
    gzip_min_length 100;
    gzip_types application/javascript text/css text/xml image/jpeg image/gif image/png;
    gzip_disable "MSIE [1-6]\.";
    gzip_vary on;

    server {
        # 无域名访问，就用localhost
        server_name localhost;
        # 80端口
        listen  8002;
        root /usr/share/nginx/html;

        # The SPA shell and service worker must stay fresh after each deploy.
        location = /index.html {
            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
            try_files /index.html =404;
        }

        location = /service-worker.js {
            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
            try_files /service-worker.js =404;
        }

        location = /manifest.json {
            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
            try_files /manifest.json =404;
        }

        # Mobile parent console H5 build. It is mounted under /tbot-mobile/ so the
        # admin web console can keep owning the root SPA.
        location = /tbot-mobile/index.html {
            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
            try_files /tbot-mobile/index.html =404;
        }

        location ~* ^/tbot-mobile/assets/.+\.(?:js|css|png|jpg|jpeg|gif|svg|webp|ico|woff2?|eot|ttf|otf)$ {
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            try_files $uri =404;
        }

        location /tbot-mobile/ {
            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
            try_files $uri $uri/ /tbot-mobile/index.html;
        }

        location /mobile/ {
            return 302 /tbot-mobile/;
        }

        # Hashed Vue assets are content-addressed and safe to cache hard.
        location ~* ^/(js|css|img|fonts)/.+\.(?:js|css|png|jpg|jpeg|gif|svg|webp|ico|woff2?|eot|ttf|otf)$ {
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            try_files $uri =404;
        }

        # Content-addressed TVideo cue derivatives generated by the dedicated
        # backend render worker into the shared production volume.
        location ~ "^/lesson-derivatives/lessons/derivatives/([0-9a-f]{64})/([a-z][a-z0-9-]{0,63}\.(?:mp4|trgb))$" {
            alias /uploadfile/lesson-derivatives/lessons/derivatives/$1/$2;
            types {
                video/mp4 mp4;
                application/vnd.tbot.rgb565-indexed trgb;
            }
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            add_header Accept-Ranges bytes always;
            add_header X-Content-Type-Options nosniff always;
            limit_except GET HEAD { deny all; }
        }

        # Derivative misses must never fall through to the manager SPA shell.
        location /lesson-derivatives/ {
            return 404;
        }

        # 转发到编译后到web目录
        location / {
            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
            try_files $uri $uri/ /index.html;
        }

        # 转发到manager-api
        location /tbot/ {
            proxy_pass http://127.0.0.1:8003;
            proxy_set_header   Host   $host;
            proxy_cookie_path /manager/ /;
            proxy_set_header   Referer $http_referer;
            proxy_set_header   Cookie $http_cookie;

            proxy_connect_timeout 15;
            proxy_send_timeout 15;
            proxy_read_timeout 15;

            proxy_set_header   X-Real-IP  $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Some firmware builds use /ota/ directly instead of /tbot/ota/.
        location /ota/ {
            proxy_pass http://127.0.0.1:8003/tbot/ota/;
            proxy_set_header   Host   $host;
            proxy_set_header   X-Real-IP  $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Validate the manager-web bearer before nginx injects the server-only
        # NestJS credential. The endpoint returns real 204/401/403 statuses and
        # accepts only active manager super-admin accounts.
        location = /_nestjs_manager_auth {
            internal;
            proxy_pass http://127.0.0.1:8003/tbot/user/proxy-auth;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header Authorization $http_authorization;
        }

        # Course CMS (migrated into manager-web) -> a NestJS authoring API.
        # Same-origin from the SPA, so the browser needs no CORS. The upstream host
        # + an optional shared token are injected at container start from the
        # NESTJS_UPSTREAM_HOST / NESTJS_TOKEN env vars (start.sh sed-substitutes the
        # __PLACEHOLDERS__ into this file). To repoint at a different NestJS backend
        # later, just edit those env vars and restart the container -- no rebuild.
        location /nestjs/ {
            auth_request /_nestjs_manager_auth;
            auth_request_set $manager_auth_status $upstream_status;
            add_header X-TBOT-Manager-Auth-Status $manager_auth_status always;

            # The manager Bearer token is the sole browser-facing credential.
            # HTTP Basic cannot be layered here because both schemes consume the
            # Authorization header; enabling it would reject every Bearer session.

            # Docker's embedded DNS resolves service names and forwards external
            # names. Public resolvers must not be listed here: they return NXDOMAIN
            # for compose-only names such as `backend`.
            # Keep Docker DNS failures short-lived. During compose recreation the
            # backend name can briefly return NXDOMAIN; a long negative cache turns
            # that startup race into minutes of 502 responses.
            resolver 127.0.0.11 valid=5s ipv6=off;
            resolver_timeout 2s;
            set $nestjs_host __NESTJS_UPSTREAM_HOST__;
            # Select auth before `rewrite ... break`; break terminates the rewrite
            # phase and would skip any set/if directives placed after it.
            set $nest_auth "__NESTJS_AUTH_HEADER__";
            if ($http_x_nest_authorization) { set $nest_auth $http_x_nest_authorization; }
            rewrite ^/nestjs/(.*)$ /$1 break;
            # Scheme is env-driven: https for an external HTTPS backend (Render),
            # http for an internal same-VPS NestJS container.
            proxy_pass __NESTJS_UPSTREAM_SCHEME__://$nestjs_host;
            proxy_ssl_server_name on;
            proxy_set_header Host $nestjs_host;
            proxy_set_header Cf-Access-Jwt-Assertion $http_cf_access_jwt_assertion;
            # Always overwrite a browser-supplied value with the server-only key.
            proxy_set_header X-TBOT-Admin-Key "__NESTJS_ADMIN_PROXY_KEY__";
            # Shared token from NESTJS_TOKEN (start.sh injects "Bearer <token>" or empty).
            # Per-user X-Nest-Authorization (from NestLoginDialog) overrides when present.
            # Empty Authorization + no X-Nest header -> NestJS 401 -> UI opens Author sign-in.
            proxy_set_header Authorization $nest_auth;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_connect_timeout 30;
            proxy_send_timeout 60;
            proxy_read_timeout 60;
        }
    }
}
