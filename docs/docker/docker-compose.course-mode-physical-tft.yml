name: tbot-course-mode-physical-tft

services:
  backend:
    image: ${TBOT_LESSON_STUDIO_BACKEND_IMAGE:?run docs/docker/course-mode-physical-tft/up.sh}
    extra_hosts:
      - host.docker.internal:host-gateway
    ports: !override
      - "127.0.0.1:3000:3000"
    environment:
      COURSE_MODE_V2_PUBLISH_ENABLED: "true"
      COURSE_MODE_LOCAL_PHYSICAL_TFT_ENABLED: "true"
      LESSON_STUDIO_NEW_ASSIGNMENTS_ENABLED: "true"
      LESSON_ROLLOUT_DEVICE_ALLOWLIST: "14:c1:9f:d1:ac:20"
      ROBOT_ESP_BASE_URL: http://host.docker.internal:8003
      TBOT_ESP_SERVER_URL: http://host.docker.internal:8003
      TBOT_DEVICE_MINT_SECRET: ${TBOT_DEVICE_MINT_SECRET:?export the shared local device mint secret}
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY:?course-mode physical TFT requires a matching local private PEM}
      LESSON_ASSET_ORIGIN_BASE: ${COURSE_MODE_ASSET_ORIGIN_BASE:?export the robot-reachable local asset origin ending in /}
      FLATTENED_CINEMATIC_PUBLIC_BASE_URL: ${COURSE_MODE_ASSET_ORIGIN_BASE:?export the robot-reachable local asset origin ending in /}

  course-mode-materialize:
    image: ${TBOT_COURSE_MODE_V5_MATERIALIZER_IMAGE:?run docs/docker/course-mode-physical-tft/up.sh}
    depends_on:
      backend:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://tbot:tbot@postgres:5432/tbot
      COURSE_MODE_V2_PUBLISH_ENABLED: "true"
      COURSE_MODE_V5_SOURCE_ROOT: /course-mode-v5-source
      COURSE_MODE_V5_FIXTURE_ROOT: /app/dist/lessons/fixtures/course-mode
      COURSE_MODE_LOCAL_PHYSICAL_TFT_ENABLED: "true"
      FLATTENED_CINEMATIC_PUBLIC_BASE_URL: ${COURSE_MODE_ASSET_ORIGIN_BASE:?export the robot-reachable local asset origin ending in /}
    command:
      - dist/lessons/course-mode/course-mode-v5-identity-materializer.js
      - materialize
    volumes:
      - ${TBOT_ESP_REPOSITORY_ROOT:?export the ESP repository root}:/course-mode-v5-source:ro
    networks: [lesson-studio-e2e]

  seed-postgres:
    profiles: [disabled-course-mode-physical-tft]

  seed-mysql:
    profiles: [disabled-course-mode-physical-tft]

  web:
    depends_on: !override
      backend:
        condition: service_healthy
      course-mode-materialize:
        condition: service_completed_successfully
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes: !override
      - ./nginx.conf:/etc/nginx/nginx.conf.template:ro
      - ${TBOT_ESP_REPOSITORY_ROOT:?export the ESP repository root}/main/manager-web/public/tvideo-demo/assets/t54-layered:/usr/share/nginx/html/main/manager-web/public/tvideo-demo/assets/t54-layered:ro
      - ${TBOT_BACKEND_WORKTREE:?export the task-owned backend worktree}/src/lessons/fixtures/course-mode/pilot/v2:/usr/share/nginx/html/pilot/v2:ro
