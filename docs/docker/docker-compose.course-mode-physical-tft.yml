name: tbot-course-mode-physical-tft

services:
  backend:
    ports: !override
      - "127.0.0.1:3000:3000"
    environment:
      COURSE_MODE_V2_PUBLISH_ENABLED: "true"
      COURSE_MODE_LOCAL_PHYSICAL_TFT_ENABLED: "true"
      LESSON_STUDIO_NEW_ASSIGNMENTS_ENABLED: "true"
      LESSON_ROLLOUT_DEVICE_ALLOWLIST: "14:c1:9f:d1:ac:20"
      TBOT_DEVICE_MINT_SECRET: ${TBOT_DEVICE_MINT_SECRET:?export the shared local device mint secret}
      LESSON_ASSET_ORIGIN_BASE: ${COURSE_MODE_ASSET_ORIGIN_BASE:?export the robot-reachable local asset origin ending in /}
      FLATTENED_CINEMATIC_PUBLIC_BASE_URL: ${COURSE_MODE_ASSET_ORIGIN_BASE:?export the robot-reachable local asset origin ending in /}

  course-mode-materialize:
    image: ${TBOT_LESSON_STUDIO_BACKEND_IMAGE:-local/tbot-backend:lesson-studio-e2e}
    depends_on:
      backend:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://tbot:tbot@postgres:5432/tbot
      COURSE_MODE_LOCAL_COMPOSE_ENABLED: "true"
      COURSE_MODE_DEVICE_MAC: "14:c1:9f:d1:ac:20"
      COURSE_MODE_FIXTURE_ROOT: /course-mode-fixtures
      COURSE_MODE_LOCAL_PHYSICAL_TFT_ENABLED: "true"
      FLATTENED_CINEMATIC_PUBLIC_BASE_URL: ${COURSE_MODE_ASSET_ORIGIN_BASE:?export the robot-reachable local asset origin ending in /}
    command:
      - node
      - dist/lessons/course-mode/course-mode-local-materializer.js
      - materialize
    volumes:
      - ${TBOT_BACKEND_WORKTREE:?export the task-owned backend worktree}/src/lessons/fixtures/course-mode:/course-mode-fixtures:ro
    networks: [lesson-studio-e2e]

  web:
    depends_on:
      course-mode-materialize:
        condition: service_completed_successfully
    volumes:
      - ${TBOT_BACKEND_WORKTREE:?export the task-owned backend worktree}/src/lessons/fixtures/course-mode/pilot/v1/assets:/usr/share/nginx/html/course-mode/pilot/v1/assets:ro
      - ${TBOT_BACKEND_WORKTREE:?export the task-owned backend worktree}/src/lessons/fixtures/course-mode/pilot/v1/derivatives:/usr/share/nginx/html/lessons/derivatives:ro
